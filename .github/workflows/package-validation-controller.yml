name: Package validation controller

on:
  workflow_dispatch:
    inputs:
      before:
        description: 'Optional baseline commit SHA (default: HEAD^); use a full 40-character SHA'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: package-validation-controller
  cancel-in-progress: false
  queue: max

jobs:
  controller:
    name: Evaluate unsigned package validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify read-only dependencies
        shell: bash
        run: |
          set -euo pipefail
          for tool in python3 git gh; do
            command -v "$tool"
          done
          python3 scripts/package-pipeline/validate_manifest.py

      - name: Select packages and evaluate validation history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_SHA: ${{ inputs.before }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(
              0, str(root / "scripts/package-pipeline")
          )

          from evaluate_validation import (
              REPOSITORY,
              evaluate,
              historical_identity,
          )
          from github_validation_history import github_api
          from package_fingerprint import fingerprint
          from select_package_validation import select_revisions

          def git(*args):
              return subprocess.check_output(
                  ["git", *args],
                  text=True,
              ).strip()

          current = git("rev-parse", "HEAD")

          assert current == os.environ["GITHUB_SHA"], (
              "Checkout does not match triggering commit"
          )

          before = os.environ.get("BASELINE_SHA", "").strip()

          if not before:
              before = git("rev-parse", "HEAD^")

          packages = select_revisions(
              root, before, current
          )

          results = []

          for package in packages:
              target = fingerprint(
                  root, current, package
              )

              result = evaluate(
                  github_api,
                  REPOSITORY,
                  package,
                  target,
                  lambda sha, name: historical_identity(
                      root, sha, name
                  ),
              )

              results.append(result)

          lines = [
              "## Package validation controller",
              "",
              f"Baseline: `{before}`",
              f"Current: `{current}`",
              "",
              "| Package | Decision |",
              "|---|---|",
          ]

          for result in results:
              lines.append(
                  f"| {result['package']} "
                  f"| {result['decision']} |"
              )

          if not results:
              lines.append(
                  "| None selected | No validation required |"
              )

          lines.extend([
              "",
              "Read-only evaluation.",
              "No workflow dispatch, signing, or publication.",
          ])

          summary = "\n".join(lines) + "\n"

          print(summary)

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(summary)

          print(json.dumps(
              results, sort_keys=True
          ))
          PY
