name: Package validation controller

on:
  workflow_dispatch:
    inputs:
      before:
        description: 'Optional baseline commit SHA (default: HEAD^); use a full 40-character SHA'
        required: false
        type: string

  push:
    branches: [main]
    paths:
      - 'arch/packages/manifest.json'

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: package-validation-controller
  cancel-in-progress: false
  queue: max

jobs:
  controller:
    if: github.event_name == 'workflow_dispatch'
    name: Evaluate unsigned package validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify read-only dependencies
        shell: bash
        run: |
          set -euo pipefail
          for tool in python3 git gh; do
            command -v "$tool"
          done
          python3 scripts/package-pipeline/validate_manifest.py

      - name: Select packages and evaluate validation history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_SHA: ${{ inputs.before }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(
              0, str(root / "scripts/package-pipeline")
          )

          from evaluate_validation import (
              REPOSITORY,
              evaluate,
              historical_identity,
          )
          from github_validation_history import github_api
          from package_fingerprint import fingerprint
          from select_package_validation import select_revisions

          def git(*args):
              return subprocess.check_output(
                  ["git", *args],
                  text=True,
              ).strip()

          current = git("rev-parse", "HEAD")

          assert current == os.environ["GITHUB_SHA"], (
              "Checkout does not match triggering commit"
          )

          before = os.environ.get("BASELINE_SHA", "").strip()

          if not before:
              before = git("rev-parse", "HEAD^")

          packages = select_revisions(
              root, before, current
          )

          results = []

          for package in packages:
              target = fingerprint(
                  root, current, package
              )

              result = evaluate(
                  github_api,
                  REPOSITORY,
                  package,
                  target,
                  lambda sha, name: historical_identity(
                      root, sha, name
                  ),
              )

              results.append(result)

          lines = [
              "## Package validation controller",
              "",
              f"Baseline: `{before}`",
              f"Current: `{current}`",
              "",
              "| Package | Decision |",
              "|---|---|",
          ]

          for result in results:
              lines.append(
                  f"| {result['package']} "
                  f"| {result['decision']} |"
              )

          if not results:
              lines.append(
                  "| None selected | No validation required |"
              )

          lines.extend([
              "",
              "Read-only evaluation.",
              "No workflow dispatch, signing, or publication.",
          ])

          summary = "\n".join(lines) + "\n"

          print(summary)

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(summary)

          print(json.dumps(
              results, sort_keys=True
          ))
          PY


  verify-merged-selection:
    name: Verify merged source selection
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout complete production history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pushed production revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = T4T3Z0R/packages
          test "$GITHUB_ACTOR" = T4T3Z0R
          test "$GITHUB_TRIGGERING_ACTOR" = T4T3Z0R
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api repos/T4T3Z0R/packages/branches/main --jq .commit.sha)" = "$GITHUB_SHA"
          python3 scripts/package-pipeline/validate_manifest.py
          for package in ghostty keepassxc syncthing wezterm; do
            python3 scripts/package-pipeline/verify_source_contract.py \
              --package "$package"
          done

      - name: Verify merged PR and owner approval without dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/package-pipeline/merged_selection_validation.py \
            "$GITHUB_EVENT_PATH" | tee merged-selection-plan.json
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path('merged-selection-plan.json').read_text())
          lines = [
              '## Merged source-selection verification',
              '',
              f"Decision: **{result['decision']}**",
              f"Revision: `{result['revision']}`",
              '',
              'Read-only decision. No workflow dispatch, signing, or publication.',
          ]
          if result['decision'] == 'review_validation':
              lines.insert(3, f"Package: `{result['package']}`")
              lines.insert(4, f"Unsigned workflow: `{result['workflow']}`")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('\n'.join(lines) + '\n')
          PYTHON
