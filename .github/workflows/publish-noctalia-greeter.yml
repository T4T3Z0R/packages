name: Publish noctalia-greeter

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Upstream Noctalia Greeter release tag
        required: true
        default: v1.2.1
        type: string

permissions:
  contents: read

env:
  UPSTREAM_REPOSITORY: noctalia-dev/noctalia-greeter
  SECURITY_FIX: e025d3fce796668b48ad33ad3fc49686452f29ce
  REPO_NAME: t4t3z0r
  RELEASE_TAG: arch-repo
  SIGNING_SUBKEY: A2A5AEC28C6D94EF2FB3EC75AC3E97B561D89610

jobs:
  validate:
    name: Validate unsigned candidate
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Install validation dependencies
        run: |
          set -euo pipefail

          pacman -Syu --noconfirm --needed \
            base-devel git curl jq namcap \
            meson ninja pkgconf \
            greetd dbus \
            wayland wayland-protocols wlroots0.20 \
            libglvnd libinput \
            freetype2 fontconfig \
            cairo pango harfbuzz \
            libxkbcommon glib2 \
            libwebp librsvg \
            tomlplusplus nlohmann-json stb

      - name: Checkout package infrastructure
        uses: actions/checkout@v6

      - name: Checkout upstream greeter
        uses: actions/checkout@v6
        with:
          repository: noctalia-dev/noctalia-greeter
          ref: ${{ inputs.source_tag }}
          fetch-depth: 0
          path: source/noctalia-greeter

      - name: Trust checked-out repositories
        run: |
          set -euo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/source/noctalia-greeter"

      - name: Verify upstream tag and security baseline
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_TAG" =~ ^v[0-9A-Za-z._+-]+$ ]]; then
            echo "Invalid source tag: $SOURCE_TAG" >&2
            exit 1
          fi

          mkdir -p evidence

          ref_json="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${UPSTREAM_REPOSITORY}/git/ref/tags/${SOURCE_TAG}"
          )"

          tag_type="$(jq -r '.object.type' <<< "$ref_json")"

          if [[ "$tag_type" != "tag" ]]; then
            echo "Release tag is not an annotated tag" >&2
            exit 1
          fi

          tag_sha="$(jq -r '.object.sha' <<< "$ref_json")"

          tag_json="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${UPSTREAM_REPOSITORY}/git/tags/${tag_sha}"
          )"

          verified="$(jq -r '.verification.verified' <<< "$tag_json")"
          reason="$(jq -r '.verification.reason' <<< "$tag_json")"

          if [[ "$verified" != "true" || "$reason" != "valid" ]]; then
            echo "Upstream tag signature is not verified and valid" >&2
            exit 1
          fi

          api_source_sha="$(jq -r '.object.sha' <<< "$tag_json")"

          local_source_sha="$(
            git -C source/noctalia-greeter \
              rev-parse "${SOURCE_TAG}^{}"
          )"

          if [[ "$local_source_sha" != "$api_source_sha" ]]; then
            echo "Checked-out commit does not match verified tag target" >&2
            exit 1
          fi

          if ! git -C source/noctalia-greeter \
            merge-base --is-ancestor \
            "$SECURITY_FIX" \
            "$local_source_sha"
          then
            echo "Required security fix is not present in candidate" >&2
            exit 1
          fi

          pkgver="${SOURCE_TAG#v}"
          pkgver="${pkgver//-/_}"

          {
            echo "SOURCE_TAG=$SOURCE_TAG"
            echo "TAG_SHA=$tag_sha"
            echo "SOURCE_SHA=$local_source_sha"
            echo "PKGVER=$pkgver"
          } >> "$GITHUB_ENV"

          jq '{
            tag_object: .sha,
            tag: .tag,
            target: .object.sha,
            verification: {
              verified: .verification.verified,
              reason: .verification.reason,
              verified_at: .verification.verified_at
            }
          }' <<< "$tag_json" \
            > evidence/upstream-tag-verification.json

      - name: Create package source
        run: |
          set -euo pipefail

          mkdir -p build/noctalia-greeter

          git -C source/noctalia-greeter archive \
            --format=tar.gz \
            --prefix=noctalia-greeter-src/ \
            "$SOURCE_SHA" \
            > build/noctalia-greeter/noctalia-greeter-src.tar.gz

          source_sha256="$(
            sha256sum \
              build/noctalia-greeter/noctalia-greeter-src.tar.gz \
            | awk '{print $1}'
          )"

          sed \
            -e "s/@PKGVER@/${PKGVER}/g" \
            -e "s/@SOURCE_SHA256@/${source_sha256}/g" \
            arch/noctalia-greeter-t4t3z0r/PKGBUILD.in \
            > build/noctalia-greeter/PKGBUILD

          {
            echo "SOURCE_SHA256=$source_sha256"
          } >> "$GITHUB_ENV"

          printf '%s  %s\n' \
            "$source_sha256" \
            "noctalia-greeter-src.tar.gz" \
            > evidence/source-SHA256SUMS

      - name: Build unsigned package
        run: |
          set -euo pipefail

          useradd -m builduser

          chown -R builduser:builduser \
            source \
            build

          su builduser -c "
            cd '$GITHUB_WORKSPACE/build/noctalia-greeter'
            makepkg --noconfirm --cleanbuild
          "

      - name: Inspect candidate package
        run: |
          set -euo pipefail

          mkdir -p candidate evidence/package-root

          pkg="$(
            find build/noctalia-greeter \
              -maxdepth 1 \
              -type f \
              -name 'noctalia-greeter-t4t3z0r-*.pkg.tar.zst' \
              -print -quit
          )"

          test -n "$pkg"

          package_file="$(basename "$pkg")"

          cp "$pkg" candidate/

          pacman -Qip "$pkg" \
            | tee evidence/package-info.txt

          pacman -Qlp "$pkg" \
            > evidence/pacman-package-files.txt

          bsdtar -tf "$pkg" \
            | sed 's#^\\./##' \
            | tee evidence/package-files.txt

          bsdtar -xOf "$pkg" .PKGINFO \
            > evidence/PKGINFO

          required_files=(
            usr/bin/noctalia-greeter
            usr/bin/noctalia-greeter-compositor
            usr/bin/noctalia-greeter-session
            usr/bin/noctalia-greeter-apply-appearance
            usr/bin/noctalia-greeter-print-greetd-config
            usr/share/noctalia-greeter/setup_greeter_system.sh
            usr/share/polkit-1/actions/org.noctalia.greeter.apply-appearance.policy
            usr/share/licenses/noctalia-greeter-t4t3z0r/LICENSE
            usr/lib/tmpfiles.d/noctalia-greeter.conf
          )

          for required in "${required_files[@]}"; do
            if ! grep -Fxq "$required" evidence/package-files.txt; then
              echo "Required package file missing: $required" >&2
              exit 1
            fi
          done

          if ! grep -q \
            '^usr/share/noctalia-greeter/assets/' \
            evidence/package-files.txt
          then
            echo "Required greeter assets tree is missing" >&2
            exit 1
          fi

          bsdtar -xf "$pkg" \
            -C evidence/package-root

          for binary in \
            usr/bin/noctalia-greeter \
            usr/bin/noctalia-greeter-compositor \
            usr/bin/noctalia-greeter-apply-appearance
          do
            {
              echo "=== $binary ==="
              ldd "evidence/package-root/$binary"
              echo
            } >> evidence/ldd.txt
          done

          if grep -q 'not found' evidence/ldd.txt; then
            echo "Unresolved runtime linkage detected" >&2
            cat evidence/ldd.txt
            exit 1
          fi

          namcap build/noctalia-greeter/PKGBUILD \
            > evidence/namcap-PKGBUILD.txt \
            2>&1 || true

          namcap "$pkg" \
            > evidence/namcap-package.txt \
            2>&1 || true

          if grep -Eq ' E: ' \
            evidence/namcap-PKGBUILD.txt \
            evidence/namcap-package.txt
          then
            echo "Namcap reported package errors" >&2
            cat evidence/namcap-PKGBUILD.txt >&2
            cat evidence/namcap-package.txt >&2
            exit 1
          fi

          package_sha256="$(
            sha256sum "$pkg" \
            | awk '{print $1}'
          )"

          printf '%s  %s\n' \
            "$package_sha256" \
            "$package_file" \
            > evidence/package-SHA256SUMS

          {
            echo "PACKAGE_FILE=$package_file"
            echo "PACKAGE_SHA256=$package_sha256"
          } >> "$GITHUB_ENV"

      - name: Candidate summary
        run: |
          {
            echo '## noctalia-greeter unsigned candidate'
            echo
            echo "- Upstream tag: \`${SOURCE_TAG}\`"
            echo "- Tag object: \`${TAG_SHA}\`"
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- Security fix ancestor: \`${SECURITY_FIX}\`"
            echo "- Source SHA-256: \`${SOURCE_SHA256}\`"
            echo "- Package: \`${PACKAGE_FILE}\`"
            echo "- Package SHA-256: \`${PACKAGE_SHA256}\`"
            echo "- Signed: **NO**"
            echo "- Published: **NO**"
            echo
            echo 'Candidate is ready for package-content and dependency review.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: noctalia-greeter-${{ inputs.source_tag }}-candidate
          path: |
            candidate/
            evidence/
          if-no-files-found: error
          retention-days: 7

  approval-ready:
    name: Notify signing approval ready
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Send Pushover approval notification
        env:
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail

          test -n "$PUSHOVER_APP_TOKEN"
          test -n "$PUSHOVER_USER_KEY"

          curl \
            --fail \
            --silent \
            --show-error \
            --form-string "token=$PUSHOVER_APP_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=Package approval required" \
            --form-string \
              "message=noctalia-greeter ${SOURCE_TAG} passed validation and is ready for signing approval." \
            --form-string \
              "url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --form-string "url_title=Review deployment" \
            https://api.pushover.net/1/messages.json

          echo 'Pushover signing-approval notification sent.' \
            >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Sign and publish approved candidate
    needs:
      - validate
      - approval-ready

    runs-on: ubuntu-latest

    environment:
      name: arch-repo-publish

    permissions:
      contents: write

    concurrency:
      group: arch-repo-publish
      cancel-in-progress: false

    container:
      image: archlinux:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Install publishing dependencies
        run: |
          set -euo pipefail

          pacman -Syu --noconfirm --needed \
            git \
            github-cli \
            gnupg

      - name: Checkout package infrastructure
        uses: actions/checkout@v6

      - name: Trust checked-out repository
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download exact validated candidate
        uses: actions/download-artifact@v8
        with:
          name: noctalia-greeter-${{ inputs.source_tag }}-candidate
          path: validated

      - name: Verify validated candidate
        run: |
          set -euo pipefail

          checksum_file="validated/evidence/package-SHA256SUMS"
          test -s "$checksum_file"

          read -r expected_sha package_file < "$checksum_file"

          case "$package_file" in
            noctalia-greeter-t4t3z0r-*.pkg.tar.zst)
              ;;
            *)
              echo "Unexpected package filename: $package_file" >&2
              exit 1
              ;;
          esac

          pkg="validated/candidate/${package_file}"
          test -f "$pkg"

          actual_sha="$(
            sha256sum "$pkg" \
              | awk '{print $1}'
          )"

          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "Validated package SHA-256 mismatch" >&2
            echo "Expected: $expected_sha" >&2
            echo "Actual:   $actual_sha" >&2
            exit 1
          fi

          mkdir -p package-output
          cp "$pkg" package-output/

          {
            echo "PACKAGE_FILE=$package_file"
            echo "PACKAGE_SHA256=$actual_sha"
          } >> "$GITHUB_ENV"

      - name: Import repository signing subkey
        env:
          ARCH_REPO_SIGNING_KEY: ${{ secrets.ARCH_REPO_SIGNING_KEY }}
        run: |
          set -euo pipefail

          test -n "$ARCH_REPO_SIGNING_KEY"

          printf '%s\n' "$ARCH_REPO_SIGNING_KEY" \
            | gpg --batch --import

          gpg --batch --list-secret-keys "$SIGNING_SUBKEY"

      - name: Sign approved package
        env:
          ARCH_REPO_SIGNING_PASSPHRASE: ${{ secrets.ARCH_REPO_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail

          pkg="package-output/${PACKAGE_FILE}"

          printf '%s' "$ARCH_REPO_SIGNING_PASSPHRASE" \
            | gpg \
                --batch \
                --yes \
                --pinentry-mode loopback \
                --passphrase-fd 0 \
                --local-user "${SIGNING_SUBKEY}!" \
                --output "${pkg}.sig" \
                --detach-sign \
                "$pkg"

          gpg --verify "${pkg}.sig" "$pkg"

      - name: Assemble signed repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCH_REPO_SIGNING_PASSPHRASE: ${{ secrets.ARCH_REPO_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail

          mkdir -p repo-output

          gh release view "$RELEASE_TAG" >/dev/null

          gh release download "$RELEASE_TAG" \
            --pattern '*.pkg.tar.zst' \
            --pattern '*.pkg.tar.zst.sig' \
            --dir repo-output

          shopt -s nullglob
          existing_packages=( repo-output/*.pkg.tar.zst )

          for existing_pkg in "${existing_packages[@]}"; do
            existing_sig="${existing_pkg}.sig"

            if [[ ! -f "$existing_sig" ]]; then
              echo "Existing repository package lacks signature: $existing_pkg" >&2
              exit 1
            fi

            gpg --verify "$existing_sig" "$existing_pkg"
          done

          rm -f \
            repo-output/noctalia-greeter-t4t3z0r-*.pkg.tar.zst \
            repo-output/noctalia-greeter-t4t3z0r-*.pkg.tar.zst.sig

          cp "package-output/${PACKAGE_FILE}" repo-output/
          cp "package-output/${PACKAGE_FILE}.sig" repo-output/

          cd repo-output

          shopt -s nullglob
          packages=( *.pkg.tar.zst )

          if (( ${#packages[@]} == 0 )); then
            echo "No Pacman packages available for repository database" >&2
            exit 1
          fi

          repo-add \
            --include-sigs \
            "${REPO_NAME}.db.tar.zst" \
            "${packages[@]}"

          rm -f "${REPO_NAME}.db" "${REPO_NAME}.files"

          cp -L "${REPO_NAME}.db.tar.zst" "${REPO_NAME}.db"
          cp -L "${REPO_NAME}.files.tar.zst" "${REPO_NAME}.files"

          rm -f \
            "${REPO_NAME}.db.tar.zst" \
            "${REPO_NAME}.files.tar.zst"

          sign_file() {
            local file="$1"

            printf '%s' "$ARCH_REPO_SIGNING_PASSPHRASE" \
              | gpg \
                  --batch \
                  --yes \
                  --pinentry-mode loopback \
                  --passphrase-fd 0 \
                  --local-user "${SIGNING_SUBKEY}!" \
                  --output "${file}.sig" \
                  --detach-sign \
                  "$file"

            gpg --verify "${file}.sig" "$file"
          }

          sign_file "${REPO_NAME}.db"
          sign_file "${REPO_NAME}.files"

          cp \
            "$GITHUB_WORKSPACE/arch/keys/t4t3z0r-package-signing.asc" \
            .

          find . \
            -maxdepth 1 \
            -type f \
            ! -name SHA256SUMS \
            -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum \
            > SHA256SUMS

      - name: Publish rolling Arch repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh release view "$RELEASE_TAG" >/dev/null

          gh release upload "$RELEASE_TAG" \
            "repo-output/${PACKAGE_FILE}" \
            "repo-output/${PACKAGE_FILE}.sig" \
            --clobber

          gh release upload "$RELEASE_TAG" \
            repo-output/t4t3z0r-package-signing.asc \
            repo-output/SHA256SUMS \
            repo-output/t4t3z0r.files \
            repo-output/t4t3z0r.files.sig \
            --clobber

          # Database last. Existing clients remain on the old valid
          # repository state until this succeeds.
          gh release upload "$RELEASE_TAG" \
            repo-output/t4t3z0r.db \
            repo-output/t4t3z0r.db.sig \
            --clobber

          mapfile -t desired < <(
            find repo-output \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort
          )

          mapfile -t existing < <(
            gh release view "$RELEASE_TAG" \
              --json assets \
              --jq '.assets[].name'
          )

          for asset in "${existing[@]}"; do
            if ! printf '%s\n' "${desired[@]}" \
              | grep -Fxq -- "$asset"
            then
              gh release delete-asset \
                "$RELEASE_TAG" \
                "$asset" \
                --yes
            fi
          done

      - name: Publication summary
        run: |
          {
            echo '## Published noctalia-greeter'
            echo
            echo "- Upstream tag: \`${{ inputs.source_tag }}\`"
            echo "- Package: \`${PACKAGE_FILE}\`"
            echo "- Package SHA-256: \`${PACKAGE_SHA256}\`"
            echo "- Repository: \`${REPO_NAME}\`"
            echo '- Human signing approval: **PASSED**'
            echo '- Package and repository databases signed'
          } >> "$GITHUB_STEP_SUMMARY"
