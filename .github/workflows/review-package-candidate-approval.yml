name: Review package candidate approval

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: package-candidate-selection
  cancel-in-progress: false
  queue: max

jobs:
  evaluate:
    name: Verify source-selection handoff
    if: >-
      github.event.label.name == 'candidate:approved' &&
      github.actor == 'T4T3Z0R'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Install read-only dependencies
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed python git github-cli
          command -v vercmp

      - name: Checkout production source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify event and production revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = issues
          test "$GITHUB_REPOSITORY" = T4T3Z0R/packages
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = T4T3Z0R
          test "$GITHUB_TRIGGERING_ACTOR" = T4T3Z0R
          test "$GITHUB_RUN_ATTEMPT" = 1

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api repos/T4T3Z0R/packages/branches/main --jq .commit.sha)" = "$GITHUB_SHA"

          python3 scripts/package-pipeline/validate_manifest.py

      - name: Recheck live approval, upstream, and PR history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 scripts/package-pipeline/candidate_selection_handoff.py \
            "$GITHUB_EVENT_PATH" | tee selection-handoff.json

          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              Path("selection-handoff.json").read_text()
          )
          lines = [
              "## Candidate source-selection handoff",
              "",
              f"Package: `{result['package']}`",
              f"Candidate: `{result['candidate']}`",
              f"Decision: **{result['status']}**",
              "",
              "No PR creation, workflow dispatch, signing, or publication.",
          ]
          with open(
              os.environ["GITHUB_STEP_SUMMARY"], "a",
              encoding="utf-8",
          ) as summary:
              summary.write("\n".join(lines) + "\n")
          PYTHON
