name: Review package candidate approval

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: package-candidate-selection
  cancel-in-progress: false
  queue: max

jobs:
  evaluate:
    outputs:
      status: ${{ steps.handoff.outputs.status }}
    name: Verify source-selection handoff
    if: >-
      github.event.label.name == 'candidate:approved' &&
      github.actor == 'T4T3Z0R'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Install read-only dependencies
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed python git github-cli
          command -v vercmp

      - name: Checkout production source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify event and production revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = issues
          test "$GITHUB_REPOSITORY" = T4T3Z0R/packages
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = T4T3Z0R
          test "$GITHUB_TRIGGERING_ACTOR" = T4T3Z0R
          test "$GITHUB_RUN_ATTEMPT" = 1

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api repos/T4T3Z0R/packages/branches/main --jq .commit.sha)" = "$GITHUB_SHA"

          python3 scripts/package-pipeline/validate_manifest.py

      - name: Recheck live approval, upstream, and PR history
        id: handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 scripts/package-pipeline/candidate_selection_handoff.py \
            "$GITHUB_EVENT_PATH" | tee selection-handoff.json

          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              Path("selection-handoff.json").read_text()
          )
          lines = [
              "## Candidate source-selection handoff",
              "",
              f"Package: `{result['package']}`",
              f"Candidate: `{result['candidate']}`",
              f"Decision: **{result['status']}**",
              "",
              "No PR creation, workflow dispatch, signing, or publication.",
          ]
          with open(
              os.environ["GITHUB_STEP_SUMMARY"], "a",
              encoding="utf-8",
          ) as summary:
              summary.write("\n".join(lines) + "\n")
          with open(
              os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8"
          ) as output:
              print(f"status={result['status']}", file=output)
          PYTHON

  create-selection-pr:
    outputs:
      pr_number: ${{ steps.selection.outputs.pr_number }}
      branch: ${{ steps.selection.outputs.branch }}
      revision: ${{ steps.selection.outputs.revision }}
    name: Prepare guarded draft source-selection PR
    needs: evaluate
    if: >-
      github.event_name == 'issues' &&
      github.actor == 'T4T3Z0R' &&
      (needs.evaluate.outputs.status == 'template_pr_ready' ||
      needs.evaluate.outputs.status == 'fixed_pr_ready')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write
      issues: read
      pull-requests: write

    container:
      image: archlinux:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Install selection dependencies
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed python git github-cli curl diffutils

          for tool in python3 git gh curl makepkg runuser vercmp diff cmp sort useradd install mktemp chmod; do
            command -v "$tool" >/dev/null
            echo "PASS: $tool"
          done

      - name: Checkout production source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck, prepare, and create draft PR
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          test "$GITHUB_EVENT_NAME" = issues
          test "$GITHUB_REPOSITORY" = T4T3Z0R/packages
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = T4T3Z0R
          test "$GITHUB_TRIGGERING_ACTOR" = T4T3Z0R
          test "$GITHUB_RUN_ATTEMPT" = 1

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          current_main() {
            gh api repos/T4T3Z0R/packages/branches/main \
              --jq .commit.sha
          }

          test "$(current_main)" = "$GITHUB_SHA"
          python3 scripts/package-pipeline/validate_manifest.py

          scratch="$(mktemp -d)"
          trap 'rm -rf -- "$scratch"' EXIT

          cp arch/packages/manifest.json "$scratch/main-manifest.json"

          # First fresh authorization check, including upstream and PR history.
          python3 scripts/package-pipeline/candidate_selection_handoff.py \
            "$GITHUB_EVENT_PATH" \
            --manifest "$scratch/main-manifest.json" \
            > "$scratch/initial-plan.json"

          # Resolve metadata using a fresh authorized selection plan.
          status="$(
            python3 -c '
          import json, sys
          print(json.load(open(sys.argv[1]))["status"])
          ' "$scratch/initial-plan.json"
          )"

          package="$(
            python3 -c '
          import json, sys
          print(json.load(open(sys.argv[1]))["package"])
          ' "$scratch/initial-plan.json"
          )"

          candidate="$(
            python3 -c '
          import json, sys
          print(json.load(open(sys.argv[1]))["candidate"])
          ' "$scratch/initial-plan.json"
          )"

          paths=(arch/packages/manifest.json)
          renderer_args=()

          case "$status" in
            template_pr_ready)
              case "$package" in
                gameshell|noctalia-custom|noctalia-greeter-t4t3z0r)
                  ;;
                *)
                  echo "Unexpected generated recipe" >&2
                  exit 1
                  ;;
              esac
              ;;

            fixed_pr_ready)
              case "$package" in
                ghostty|keepassxc|syncthing|wezterm|moonlight-qt|yazi|broot)
                  ;;
                *)
                  echo "Unexpected fixed recipe" >&2
                  exit 1
                  ;;
              esac

              recipe="arch/$package/PKGBUILD"

              # Run metadata resolution as a dedicated unprivileged
              # user, outside the checkout, without GitHub credentials.
              useradd --create-home selection-builder

              install -d -m 0755 \
                "$scratch/metadata-input"

              install -m 0644 \
                scripts/package-pipeline/fixed_recipe_metadata.py \
                scripts/package-pipeline/fixed_recipe_selection.py \
                scripts/package-pipeline/verify_source_contract.py \
                scripts/package-pipeline/resolve_candidate.py \
                "$scratch/metadata-input/"

              install -m 0644 \
                "$scratch/main-manifest.json" \
                "$scratch/metadata-input/manifest.json"

              chmod 0711 "$scratch"

              (
                cd /home/selection-builder

                runuser -u selection-builder -- \
                env -i \
                HOME=/home/selection-builder \
                USER=selection-builder \
                LOGNAME=selection-builder \
                PATH=/usr/bin:/bin \
                LANG=C.UTF-8 \
                python3 \
                "$scratch/metadata-input/fixed_recipe_metadata.py" \
                --package "$package" \
                --candidate "$candidate" \
                --manifest "$scratch/metadata-input/manifest.json" \
                > "$scratch/metadata.json"
              )

              paths+=("$recipe")

              renderer_args+=(
                --metadata "$scratch/metadata.json"
                --recipe "$recipe"
              )
              ;;

            *)
              echo "Unexpected selection decision: $status" >&2
              exit 1
              ;;
          esac

          python3 scripts/package-pipeline/candidate_selection_pr_writer.py \
            "$scratch/initial-plan.json" \
            --manifest arch/packages/manifest.json \
            --body-file "$scratch/pr-body.md" \
            "${renderer_args[@]}"

          python3 scripts/package-pipeline/validate_manifest.py

          if [[ "$status" == fixed_pr_ready ]]; then
            bash -n "$recipe"

            python3 scripts/package-pipeline/verify_source_contract.py \
              --package "$package"
          fi

          git diff --check

          # Exact changed-file set; no unrelated changes permitted.
          diff -u \
            <(printf '%s\n' "${paths[@]}" | LC_ALL=C sort) \
            <(git diff --name-only | LC_ALL=C sort)

          # The manifest must still change by precisely one line.
          test "$(git diff --numstat -- arch/packages/manifest.json)" = \
            "$(printf '1\t1\tarch/packages/manifest.json')"

          test -z "$(git ls-files --others --exclude-standard)"

          branch="$(
            python3 -c '
          import json, sys
          print(json.load(open(sys.argv[1]))["branch"])
          ' "$scratch/initial-plan.json"
          )"

          title="$(
            python3 -c '
          import json, sys
          print(json.load(open(sys.argv[1]))["pr_title"])
          ' "$scratch/initial-plan.json"
          )"

          git switch -c "$branch"
          git add -- "${paths[@]}"

          diff -u \
            <(printf '%s\n' "${paths[@]}" | LC_ALL=C sort) \
            <(git diff --cached --name-only | LC_ALL=C sort)
          git diff --cached --check

          git -c user.name='github-actions[bot]' \
              -c user.email='github-actions[bot]@users.noreply.github.com' \
              commit -m "$title"

          # Re-evaluate the original production selection, not the
          # modified manifest in our local PR branch.
          recheck() {
            test "$(current_main)" = "$GITHUB_SHA"

            python3 \
              scripts/package-pipeline/candidate_selection_handoff.py \
              "$GITHUB_EVENT_PATH" \
              --manifest "$scratch/main-manifest.json" \
              > "$scratch/rechecked-plan.json"

            cmp -s \
              "$scratch/initial-plan.json" \
              "$scratch/rechecked-plan.json"
          }

          recheck

          # Refuse existing branches. Never overwrite another attempt.
          test -z "$(
            git ls-remote --heads origin "refs/heads/$branch"
          )"

          gh auth setup-git --hostname github.com

          git push origin "HEAD:refs/heads/$branch"

          # Final check before creating the actual GitHub PR.
          recheck

          url="$(
            gh pr create \
              --repo T4T3Z0R/packages \
              --base main \
              --head "$branch" \
              --draft \
              --title "$title" \
              --body-file "$scratch/pr-body.md"
          )"

          revision="$(git rev-parse HEAD)"
          pr_number="${url##*/}"

          [[ "$pr_number" =~ ^[1-9][0-9]*$ ]]
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]

          test "$url" = \
            "https://github.com/T4T3Z0R/packages/pull/$pr_number"

          {
            echo "pr_number=$pr_number"
            echo "branch=$branch"
            echo "revision=$revision"
          } >> "$GITHUB_OUTPUT"

          {
            echo '## Source-selection draft PR created'
            echo
            echo "$url"
            echo
            echo 'Authorized source-selection files:'
            printf -- '- %s\\n' "${paths[@]}"
            echo 'Human PR review and merge remain required.'
            echo 'No unsigned build, signing, or publication was dispatched.'
          } >> "$GITHUB_STEP_SUMMARY"

          printf 'PASS: Draft source-selection PR: %s\n' "$url"


  dispatch-selection-ci:
    name: Dispatch guarded source-selection CI
    needs: [evaluate, create-selection-pr]
    if: >-
      github.event_name == 'issues' &&
      github.actor == 'T4T3Z0R' &&
      needs.create-selection-pr.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read

    steps:
      - name: Verify generated PR and dispatch shared CI
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.create-selection-pr.outputs.pr_number }}
          SELECTION_BRANCH: ${{ needs.create-selection-pr.outputs.branch }}
          EXPECTED_REVISION: ${{ needs.create-selection-pr.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail

          test "$GITHUB_EVENT_NAME" = issues
          test "$GITHUB_REPOSITORY" = T4T3Z0R/packages
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = T4T3Z0R
          test "$GITHUB_TRIGGERING_ACTOR" = T4T3Z0R
          test "$GITHUB_RUN_ATTEMPT" = 1

          command -v gh
          command -v jq

          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]

          issue_number="$(jq -er '.issue.number' "$GITHUB_EVENT_PATH")"
          [[ "$issue_number" =~ ^[1-9][0-9]*$ ]]

          test "$(jq -er '.action' "$GITHUB_EVENT_PATH")" = labeled
          test "$(jq -er '.label.name' "$GITHUB_EVENT_PATH")" = candidate:approved
          test "$(jq -er '.sender.login' "$GITHUB_EVENT_PATH")" = T4T3Z0R

          title="$(jq -er '.issue.title' "$GITHUB_EVENT_PATH")"

          [[ "$title" =~ ^Package\ candidate:\ ([a-z0-9-]+)\ @\ ([A-Za-z0-9._+-]{1,100})$ ]]

          package="${BASH_REMATCH[1]}"
          candidate="${BASH_REMATCH[2]}"

          case "$package" in
            broot|gameshell|ghostty|keepassxc|moonlight-qt|noctalia-custom|noctalia-greeter-t4t3z0r|syncthing|wezterm|yazi)
              ;;
            *)
              echo 'Unsupported selection package.' >&2
              exit 1
              ;;
          esac

          test "$SELECTION_BRANCH" = \
            "source-selection/issue-$issue_number-$package"

          repo="$GITHUB_REPOSITORY"

          test "$(gh api "repos/$repo/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"

          issue="$(gh api "repos/$repo/issues/$issue_number")"

          jq -e --arg title "$title" '
            .state == "open" and
            .title == $title and
            ([.labels[].name |
              select(startswith("candidate:"))] ==
              ["candidate:approved"])
          ' <<< "$issue" >/dev/null

          test "$(jq -r '.body' <<< "$issue")" = \
            "$(jq -r '.issue.body' "$GITHUB_EVENT_PATH")"

          pr="$(gh api "repos/$repo/pulls/$PR_NUMBER")"

          marker="<!-- t4t3z0r:source-selection:v1 issue=$issue_number package=$package candidate=$candidate -->"

          jq -e \
            --arg repo "$repo" \
            --arg branch "$SELECTION_BRANCH" \
            --arg sha "$EXPECTED_REVISION" \
            --arg base "$GITHUB_SHA" \
            --arg marker "$marker" '
              .state == "open" and
              .draft == true and
              .merged == false and
              .user.login == "github-actions[bot]" and
              .head.repo.full_name == $repo and
              .base.repo.full_name == $repo and
              .head.ref == $branch and
              .head.sha == $sha and
              .base.ref == "main" and
              .base.sha == $base and
              (.body | contains($marker))
            ' <<< "$pr" >/dev/null

          commit="$(gh api "repos/$repo/commits/$EXPECTED_REVISION")"

          jq -e --arg parent "$GITHUB_SHA" '
            (.parents | length) == 1 and
            .parents[0].sha == $parent
          ' <<< "$commit" >/dev/null

          test "$(
            gh api "repos/$repo/git/ref/heads/$SELECTION_BRANCH" \
              --jq .object.sha
          )" = "$EXPECTED_REVISION"

          test "$(
            gh api "repos/$repo/branches/main" --jq .commit.sha
          )" = "$GITHUB_SHA"

          gh workflow run test-package-pipeline.yml \
            --repo "$repo" \
            --ref "$SELECTION_BRANCH" \
            -f expected_revision="$EXPECTED_REVISION"

          {
            echo '## Source-selection CI requested'
            echo
            echo "PR: #$PR_NUMBER"
            echo "Revision: $EXPECTED_REVISION"
            echo
            echo 'Shared pipeline validation only.'
            echo 'Human PR review and merge remain required.'
            echo 'No package build, signing, or publication authorized.'
          } >> "$GITHUB_STEP_SUMMARY"
