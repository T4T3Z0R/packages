name: Publish noctalia-custom

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Noctalia source branch, tag, or commit
        required: true
        default: custom
        type: string
      expected_revision:
        description: Exact infrastructure commit expected for unsigned validation
        type: string
        required: false
        default: ""
      publish:
        description: Request protected signing and publication after validation
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  PACKAGE_NAME: noctalia-custom
  REPO_NAME: t4t3z0r
  RELEASE_TAG: arch-repo
  SIGNING_SUBKEY: A2A5AEC28C6D94EF2FB3EC75AC3E97B561D89610

jobs:
  validate:
    name: Validate unsigned candidate
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Install validation dependencies
        run: |
          set -euo pipefail

          pacman -Syu --noconfirm --needed \
            base-devel git namcap python \
            meson ninja pkgconf \
            wayland wayland-protocols \
            libglvnd freetype2 fontconfig noto-fonts \
            cairo pango harfbuzz hicolor-icon-theme \
            libxkbcommon glib2 \
            libsecret libsodium \
            sdbus-cpp libpipewire wireplumber polkit \
            pam curl libwebp libjxl libsndfile librsvg \
            libqalculate libxml2 \
            md4c tomlplusplus libical \
            nlohmann-json stb \
            jemalloc just clang

      - name: Checkout package infrastructure
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify requested infrastructure revision
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_revision != '' }}
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_REVISION"

      - name: Checkout Noctalia source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          repository: T4T3Z0R/noctalia
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          path: source/noctalia

      - name: Trust checked-out repositories
        run: |
          set -euo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/source/noctalia"

      - name: Resolve source metadata
        run: |
          set -euo pipefail

          git -C source/noctalia fetch --force \
            https://github.com/noctalia-dev/noctalia.git \
            'refs/tags/v*:refs/tags/v*'

          source_sha="$(git -C source/noctalia rev-parse HEAD)"
          python3 scripts/package-pipeline/generated_recipe_metadata.py \
            validate-commit --sha "$source_sha" >/dev/null

          base_tag="$(
            git -C source/noctalia describe \
              --tags \
              --abbrev=0 \
              --match 'v*' \
              "$source_sha"
          )"

          pkgver="$(
            python3 scripts/package-pipeline/generated_recipe_metadata.py \
              noctalia-version \
              --tag "$base_tag" \
              --source-sha "$source_sha"
          )"

          {
            echo "SOURCE_SHA=${source_sha}"
            echo "BASE_TAG=${base_tag}"
            echo "PKGVER=${pkgver}"
          } >> "$GITHUB_ENV"

          echo "Base tag: ${base_tag}"
          echo "Source commit: ${source_sha}"
          echo "Package version: ${pkgver}"

      - name: Verify selected manifest source
        run: |
          set -euo pipefail
          python3 scripts/package-pipeline/verify_validation_source.py \
            --package noctalia-custom --source "$SOURCE_SHA"

      - name: Create build user
        run: |
          set -euo pipefail

          test "$(id -u)" -eq 0
          test "$(git -C source/noctalia rev-parse HEAD)" = "$SOURCE_SHA"

          useradd -m builduser
          test "$(id -u builduser)" -ne 0

          mkdir -m 0755 build candidate evidence
          mkdir -m 0755 build/noctalia-custom

          # Preserve the authoritative source checkout and Git metadata.
          git clone --no-local --no-checkout --template= \
            "$GITHUB_WORKSPACE/source/noctalia" \
            build/noctalia-validation

          chown -R builduser:builduser build/noctalia-validation

          python3 -I scripts/package-pipeline/build_workspace_boundary.py \
            --user builduser \
            --workspace "$GITHUB_WORKSPACE" \
            --writable build/noctalia-validation

          runuser -u builduser -- \
            env -i \
            HOME=/home/builduser \
            USER=builduser \
            LOGNAME=builduser \
            PATH=/usr/bin:/bin \
            LANG=C.UTF-8 \
            bash -euo pipefail -c '
              test "$(id -u)" -ne 0

              for protected in \
                "$1" "$1/.git" "$1/.github" \
                "$1/arch" "$1/scripts" "$1/source" \
                "$1/source/noctalia" "$1/build" \
                "$1/build/noctalia-custom" \
                "$1/candidate" "$1/evidence"
              do
                test -d "$protected"
                test ! -w "$protected"
              done

              test ! -w "$1/arch/noctalia-custom/PKGBUILD.in"
              test ! -w "$1/scripts/package-pipeline/generated_recipe_metadata.py"
              test -w "$2"

              cd "$2"
              git checkout --detach "$3"
              test "$(git rev-parse HEAD)" = "$3"
              test -z "$(git status --porcelain)"
            ' _ "$GITHUB_WORKSPACE" \
              "$GITHUB_WORKSPACE/build/noctalia-validation" \
              "$SOURCE_SHA"

      - name: Check formatting
        run: |
          set -euo pipefail

          runuser -u builduser -- \
            env -i \
            HOME=/home/builduser \
            USER=builduser \
            LOGNAME=builduser \
            PATH=/usr/bin:/bin \
            LANG=C.UTF-8 \
            bash -euo pipefail -s -- \
              "$GITHUB_WORKSPACE/build/noctalia-validation" <<'FORMAT'
          test "$(id -u)" -ne 0
          cd "$1"

          mapfile -d '' files < <(
            find src lib \( -name '*.cpp' -o -name '*.h' \) -print0
          )

          clang-format --dry-run -Werror "${files[@]}"
          FORMAT

      - name: Generate package source
        run: |
          set -euo pipefail

          mkdir -p evidence

          git -C source/noctalia archive \
            --format=tar.gz \
            --prefix=noctalia-src/ \
            "$SOURCE_SHA" \
            > build/noctalia-custom/noctalia-src.tar.gz

          source_sha256="$(
            sha256sum build/noctalia-custom/noctalia-src.tar.gz \
              | awk '{print $1}'
          )"

          python3 scripts/package-pipeline/generated_recipe_metadata.py \
            render --package noctalia-custom \
            --value "PKGVER=$PKGVER" \
            --value "SOURCE_SHA256=$source_sha256" \
            > build/noctalia-custom/PKGBUILD

          cp build/noctalia-custom/PKGBUILD \
            evidence/rendered-PKGBUILD

          printf '%s  %s\n' \
            "$source_sha256" \
            "noctalia-src.tar.gz" \
            > evidence/source-SHA256SUMS

          git -C source/noctalia \
            diff --stat "refs/tags/${BASE_TAG}..${SOURCE_SHA}" \
            > evidence/custom-diff-stat.txt

          git -C source/noctalia \
            diff --name-status "refs/tags/${BASE_TAG}..${SOURCE_SHA}" \
            > evidence/custom-diff-files.txt

          git -C source/noctalia \
            log --oneline "refs/tags/${BASE_TAG}..${SOURCE_SHA}" \
            > evidence/custom-commits.txt

          grep -Ei \
            '(auth|pam|polkit|lock|session|input|tablet|sudo|root|privilege)' \
            evidence/custom-diff-files.txt \
            > evidence/sensitive-files.txt || true

          echo "SOURCE_SHA256=${source_sha256}" >> "$GITHUB_ENV"

          (
            cd build/noctalia-custom
            sha256sum --check --strict ../../evidence/source-SHA256SUMS
          )

          chown -R builduser:builduser build/noctalia-custom

          python3 -I scripts/package-pipeline/build_workspace_boundary.py \
            --user builduser \
            --workspace "$GITHUB_WORKSPACE" \
            --writable build/noctalia-validation \
            --writable build/noctalia-custom

      - name: Preflight package metadata
        run: |
          set -euo pipefail

          pkgbuild="$GITHUB_WORKSPACE/build/noctalia-custom/PKGBUILD"

          # Catch shell/PKGBUILD syntax damage before compiling anything.
          bash -n "$pkgbuild"

          # Capture native metadata without evaluating the recipe as root
          # or trusting a builder-created metadata file.
          test -d evidence
          test ! -L evidence
          test "$(stat -c '%u' evidence)" = "$(id -u)"

          metadata="$(mktemp evidence/.rendered-SRCINFO.XXXXXXXX)"
          trap 'rm -f -- "$metadata"' EXIT

          runuser -u builduser -- \
            env -i \
            HOME=/home/builduser \
            USER=builduser \
            LOGNAME=builduser \
            PATH=/usr/bin:/bin \
            LANG=C.UTF-8 \
            bash -e -o pipefail -c '
              test "$(id -u)" -ne 0
              cd "$1"
              makepkg --printsrcinfo
            ' _ "$GITHUB_WORKSPACE/build/noctalia-custom" \
            > "$metadata"

          test -s "$metadata"

          # Check declared dependencies against the explicitly
          # provisioned CI image. Never install from generated metadata.
          python3 scripts/package-pipeline/native_dependency_metadata.py \
            --srcinfo "$metadata" \
            --architecture "$(uname -m)"

          mv -- "$metadata" evidence/rendered-SRCINFO

      - name: Build Pacman package
        run: |
          set -euo pipefail

          runuser -u builduser -- \
            env -i \
            HOME=/home/builduser \
            USER=builduser \
            LOGNAME=builduser \
            PATH=/usr/bin:/bin \
            LANG=C.UTF-8 \
            bash -euo pipefail -c '
              test "$(id -u)" -ne 0
              test -w "$1"
              test -w "$1/PKGBUILD"
              test ! -w "$2"
              test ! -w "$2/build"
              test ! -w "$2/source/noctalia"
              test ! -w "$2/evidence"
              test ! -w "$2/candidate"
              cd "$1"
              makepkg --noconfirm --clean --cleanbuild
            ' _ "$GITHUB_WORKSPACE/build/noctalia-custom" \
              "$GITHUB_WORKSPACE"

      - name: Inspect candidate package
        run: |
          set -euo pipefail

          mkdir -p candidate evidence/package-root

          pkg="$(
            find build/noctalia-custom \
              -maxdepth 1 \
              -type f \
              -name 'noctalia-custom-*.pkg.tar.zst' \
              -print -quit
          )"

          test -n "$pkg"

          package_file="$(basename "$pkg")"
          cp "$pkg" candidate/

          pacman -Qip "$pkg" \
            | tee evidence/package-info.txt

          pacman -Qlp "$pkg" \
            > evidence/pacman-package-files.txt

          bsdtar -tf "$pkg" \
            | sed 's#^\./##' \
            | tee evidence/package-files.txt

          bsdtar -xOf "$pkg" .PKGINFO \
            > evidence/PKGINFO

          if ! grep -Fxq \
            'license = MIT AND Apache-2.0' \
            evidence/PKGINFO
          then
            echo "Package license metadata is incomplete or unexpected" >&2
            cat evidence/PKGINFO >&2
            exit 1
          fi

          required_files=(
            usr/bin/noctalia
            usr/share/licenses/noctalia-custom/LICENSE
            usr/share/licenses/noctalia-custom/fzy-LICENSE
            usr/share/licenses/noctalia-custom/Luau-LICENSE
            usr/share/licenses/noctalia-custom/Lua-LICENSE
            usr/share/licenses/noctalia-custom/Material-Color-Utilities-LICENSE
            usr/share/licenses/noctalia-custom/Wuffs-LICENSE-APACHE
            usr/share/licenses/noctalia-custom/Wuffs-LICENSE-MIT
            usr/share/licenses/noctalia-custom/Tabler-Icons-LICENSE
            usr/share/doc/noctalia-custom/CREDITS.md
          )

          for required in "${required_files[@]}"; do
            if ! grep -Fxq "$required" evidence/package-files.txt; then
              echo "Required package file missing: $required" >&2
              exit 1
            fi
          done

          bsdtar -xf "$pkg" \
            -C evidence/package-root

          file evidence/package-root/usr/bin/noctalia \
            > evidence/noctalia-file.txt

          if grep -q 'ELF' evidence/noctalia-file.txt; then
            ldd evidence/package-root/usr/bin/noctalia \
              > evidence/ldd.txt

            if grep -q 'not found' evidence/ldd.txt; then
              echo "Unresolved runtime linkage detected" >&2
              cat evidence/ldd.txt >&2
              exit 1
            fi
          fi

          notice_pairs=(
            "LICENSE|usr/share/licenses/noctalia-custom/LICENSE"
            "third_party/fzy/LICENSE|usr/share/licenses/noctalia-custom/fzy-LICENSE"
            "third_party/luau/LICENSE.txt|usr/share/licenses/noctalia-custom/Luau-LICENSE"
            "third_party/luau/lua_LICENSE.txt|usr/share/licenses/noctalia-custom/Lua-LICENSE"
            "third_party/material_color_utilities/LICENSE|usr/share/licenses/noctalia-custom/Material-Color-Utilities-LICENSE"
            "lib/third_party/wuffs/LICENSE-APACHE|usr/share/licenses/noctalia-custom/Wuffs-LICENSE-APACHE"
            "lib/third_party/wuffs/LICENSE-MIT|usr/share/licenses/noctalia-custom/Wuffs-LICENSE-MIT"
            "lib/assets/fonts/tabler-icons-license.txt|usr/share/licenses/noctalia-custom/Tabler-Icons-LICENSE"
            "CREDITS.md|usr/share/doc/noctalia-custom/CREDITS.md"
          )

          for pair in "${notice_pairs[@]}"; do
            IFS='|' read -r source_notice packaged_notice <<< "$pair"

            cmp \
              "source/noctalia/$source_notice" \
              "evidence/package-root/$packaged_notice"
          done

          namcap build/noctalia-custom/PKGBUILD \
            > evidence/namcap-PKGBUILD.txt \
            2>&1 || true

          namcap "$pkg" \
            > evidence/namcap-package.txt \
            2>&1 || true

          python scripts/package-pipeline/validate_noctalia_namcap.py \
            evidence/namcap-PKGBUILD.txt evidence/namcap-package.txt

          package_sha256="$(
            sha256sum "$pkg" \
              | awk '{print $1}'
          )"

          printf '%s  %s\n' \
            "$package_sha256" \
            "$package_file" \
            > evidence/package-SHA256SUMS

          {
            echo "PACKAGE_FILE=$package_file"
            echo "PACKAGE_SHA256=$package_sha256"
          } >> "$GITHUB_ENV"

      - name: Build, test, and lint source
        run: |
          set -euo pipefail

          runuser -u builduser -- \
            env -i \
            HOME=/home/builduser \
            USER=builduser \
            LOGNAME=builduser \
            PATH=/usr/bin:/bin \
            LANG=C.UTF-8 \
            bash -euo pipefail -c '
              test "$(id -u)" -ne 0
              cd "$1"
              test "$(git rev-parse HEAD)" = "$2"
              test -z "$(git status --porcelain)"
              just build
              just test debug --print-errorlogs
              just lint
            ' _ "$GITHUB_WORKSPACE/build/noctalia-validation" \
              "$SOURCE_SHA"

      - name: Candidate summary
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          {
            echo '## noctalia-custom unsigned candidate'
            echo
            echo "- Requested source: \`${SOURCE_REF}\`"
            echo "- Upstream base tag: \`${BASE_TAG}\`"
            echo "- Exact source commit: \`${SOURCE_SHA}\`"
            echo "- Source SHA-256: \`${SOURCE_SHA256}\`"
            echo "- Package: \`${PACKAGE_FILE}\`"
            echo "- Package SHA-256: \`${PACKAGE_SHA256}\`"
            echo "- Signed: **NO**"
            echo "- Published: **NO**"
            echo
            echo '### Custom delta'
            echo
            sed 's/^/- /' evidence/custom-diff-stat.txt
            echo
            echo '### Sensitive-area filename matches'
            echo

            if [[ -s evidence/sensitive-files.txt ]]; then
              sed 's/^/- `/' evidence/sensitive-files.txt \
                | sed 's/$/`/'
            else
              echo '- None detected by filename heuristic'
            fi

            echo
            echo '- License/attribution package checks: **PASSED**'
            echo
            echo '**READY FOR HUMAN SIGNING APPROVAL**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned candidate and evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: noctalia-custom-${{ github.run_id }}-${{ github.run_attempt }}-candidate
          path: |
            candidate/
            evidence/
          if-no-files-found: error
          retention-days: 7

  approval-ready:
    name: Notify signing approval ready
    needs: validate
    if: inputs.publish == true
    runs-on: ubuntu-latest

    steps:
      - name: Send Pushover approval notification
        env:
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail

          test -n "$PUSHOVER_APP_TOKEN"
          test -n "$PUSHOVER_USER_KEY"

          curl \
            --fail \
            --silent \
            --show-error \
            --form-string "token=$PUSHOVER_APP_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=Package approval required" \
            --form-string \
              "message=noctalia-custom ${SOURCE_REF} passed validation and is ready for signing approval." \
            --form-string \
              "url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --form-string "url_title=Review deployment" \
            https://api.pushover.net/1/messages.json

          echo 'Pushover signing-approval notification sent.' \
            >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Sign and publish approved candidate
    needs:
      - validate
      - approval-ready
    if: inputs.publish == true

    runs-on: ubuntu-latest

    environment:
      name: arch-repo-publish

    permissions:
      contents: write

    concurrency:
      group: arch-repo-publish
      cancel-in-progress: false
      queue: max

    container:
      image: archlinux:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Install publishing dependencies
        run: |
          set -euo pipefail

          pacman -Syu --noconfirm --needed \
            git \
            github-cli \
            gnupg \
            python \
            libarchive diffutils

      - name: Checkout package infrastructure
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Trust checked-out repository
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download exact validated candidate
        uses: actions/download-artifact@v8
        with:
          name: noctalia-custom-${{ github.run_id }}-${{ github.run_attempt }}-candidate
          path: validated

      - name: Verify validated candidate
        run: |
          set -euo pipefail

          checksum_file="validated/evidence/package-SHA256SUMS"
          test -s "$checksum_file"

          read -r expected_sha package_file < "$checksum_file"

          case "$package_file" in
            noctalia-custom-*.pkg.tar.zst)
              ;;
            *)
              echo "Unexpected package filename: $package_file" >&2
              exit 1
              ;;
          esac

          pkg="validated/candidate/${package_file}"
          test -f "$pkg"

          actual_sha="$(
            sha256sum "$pkg" \
              | awk '{print $1}'
          )"

          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "Validated package SHA-256 mismatch" >&2
            echo "Expected: $expected_sha" >&2
            echo "Actual:   $actual_sha" >&2
            exit 1
          fi

          mkdir -p package-output
          cp "$pkg" package-output/

          {
            echo "PACKAGE_FILE=$package_file"
            echo "PACKAGE_SHA256=$actual_sha"
          } >> "$GITHUB_ENV"

      - name: Import repository signing subkey
        env:
          ARCH_REPO_SIGNING_KEY: ${{ secrets.ARCH_REPO_SIGNING_KEY }}
        run: |
          set -euo pipefail

          test -n "$ARCH_REPO_SIGNING_KEY"

          printf '%s\n' "$ARCH_REPO_SIGNING_KEY" \
            | gpg --batch --import

          gpg --batch --list-secret-keys "$SIGNING_SUBKEY"

      - name: Sign approved package
        env:
          ARCH_REPO_SIGNING_PASSPHRASE: ${{ secrets.ARCH_REPO_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail

          pkg="package-output/${PACKAGE_FILE}"

          printf '%s' "$ARCH_REPO_SIGNING_PASSPHRASE" \
            | gpg \
                --batch \
                --yes \
                --pinentry-mode loopback \
                --passphrase-fd 0 \
                --local-user "${SIGNING_SUBKEY}!" \
                --output "${pkg}.sig" \
                --detach-sign \
                "$pkg"

          gpg --verify "${pkg}.sig" "$pkg"

      - name: Assemble signed repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCH_REPO_SIGNING_PASSPHRASE: ${{ secrets.ARCH_REPO_SIGNING_PASSPHRASE }}
        run: bash scripts/package-pipeline/assemble-repository.sh

      - name: Publish rolling Arch repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/package-pipeline/publish-repository.sh

      - name: Publication summary
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          {
            echo '## Published noctalia-custom'
            echo
            echo "- Requested source: \`${SOURCE_REF}\`"
            echo "- Package: \`${PACKAGE_FILE}\`"
            echo "- Package SHA-256: \`${PACKAGE_SHA256}\`"
            echo "- Repository: \`${REPO_NAME}\`"
            echo '- Human signing approval: **PASSED**'
            echo '- Package and repository databases signed'
          } >> "$GITHUB_STEP_SUMMARY"
