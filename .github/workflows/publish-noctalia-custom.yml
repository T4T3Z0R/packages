name: Publish noctalia-custom

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Noctalia source branch, tag, or commit
        required: true
        default: custom
        type: string

permissions:
  contents: read

env:
  REPO_NAME: t4t3z0r
  RELEASE_TAG: arch-repo
  SIGNING_SUBKEY: A2A5AEC28C6D94EF2FB3EC75AC3E97B561D89610

jobs:
  validate:
    name: Validate unsigned candidate
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Install validation dependencies
        run: |
          set -euo pipefail

          pacman -Syu --noconfirm --needed \
            base-devel git namcap \
            meson ninja pkgconf \
            wayland wayland-protocols \
            libglvnd freetype2 fontconfig noto-fonts \
            cairo pango harfbuzz hicolor-icon-theme \
            libxkbcommon glib2 \
            libsecret libsodium \
            sdbus-cpp libpipewire wireplumber polkit \
            pam curl libwebp libjxl libsndfile librsvg \
            libqalculate libxml2 \
            md4c tomlplusplus libical \
            nlohmann-json stb \
            jemalloc just clang clang22

      - name: Checkout package infrastructure
        uses: actions/checkout@v6

      - name: Checkout Noctalia source
        uses: actions/checkout@v6
        with:
          repository: T4T3Z0R/noctalia
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          path: source/noctalia

      - name: Trust checked-out repositories
        run: |
          set -euo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/source/noctalia"

      - name: Resolve source metadata
        run: |
          set -euo pipefail

          git -C source/noctalia fetch --force \
            https://github.com/noctalia-dev/noctalia.git \
            'refs/tags/v*:refs/tags/v*'

          source_sha="$(git -C source/noctalia rev-parse HEAD)"
          short_sha="${source_sha:0:8}"

          base_tag="$(
            git -C source/noctalia describe \
              --tags \
              --abbrev=0 \
              --match 'v*' \
              "$source_sha"
          )"

          base_ver="${base_tag#v}"
          pkgver="${base_ver//-/_}.custom.${short_sha}"

          {
            echo "SOURCE_SHA=${source_sha}"
            echo "BASE_TAG=${base_tag}"
            echo "PKGVER=${pkgver}"
          } >> "$GITHUB_ENV"

          echo "Base tag: ${base_tag}"
          echo "Source commit: ${source_sha}"
          echo "Package version: ${pkgver}"

      - name: Create build user
        run: |
          set -euo pipefail

          useradd -m builduser

          mkdir -p build/noctalia-custom
          chown -R builduser:builduser source build

      - name: Check formatting
        run: |
          set -euo pipefail

          su builduser -c "
            cd '$GITHUB_WORKSPACE/source/noctalia'

            mapfile -d '' files < <(
              find src \( -name '*.cpp' -o -name '*.h' \) -print0
            )

            /usr/lib/llvm22/bin/clang-format --dry-run -Werror \"\${files[@]}\"
          "

      - name: Generate package source
        run: |
          set -euo pipefail

          mkdir -p evidence

          git -C source/noctalia archive \
            --format=tar.gz \
            --prefix=noctalia-src/ \
            "$SOURCE_SHA" \
            > build/noctalia-custom/noctalia-src.tar.gz

          source_sha256="$(
            sha256sum build/noctalia-custom/noctalia-src.tar.gz \
              | awk '{print $1}'
          )"

          sed \
            -e "s/@PKGVER@/${PKGVER}/g" \
            -e "s/@SOURCE_SHA256@/${source_sha256}/g" \
            arch/noctalia-custom/PKGBUILD.in \
            > build/noctalia-custom/PKGBUILD

          cp build/noctalia-custom/PKGBUILD \
            evidence/rendered-PKGBUILD

          printf '%s  %s\n' \
            "$source_sha256" \
            "noctalia-src.tar.gz" \
            > evidence/source-SHA256SUMS

          git -C source/noctalia \
            diff --stat "${BASE_TAG}..${SOURCE_SHA}" \
            > evidence/custom-diff-stat.txt

          git -C source/noctalia \
            diff --name-status "${BASE_TAG}..${SOURCE_SHA}" \
            > evidence/custom-diff-files.txt

          git -C source/noctalia \
            log --oneline "${BASE_TAG}..${SOURCE_SHA}" \
            > evidence/custom-commits.txt

          grep -Ei \
            '(auth|pam|polkit|lock|session|input|tablet|sudo|root|privilege)' \
            evidence/custom-diff-files.txt \
            > evidence/sensitive-files.txt || true

          echo "SOURCE_SHA256=${source_sha256}" >> "$GITHUB_ENV"

          chown -R builduser:builduser build/noctalia-custom

      - name: Preflight package metadata
        run: |
          set -euo pipefail

          pkgbuild="$GITHUB_WORKSPACE/build/noctalia-custom/PKGBUILD"

          # Catch shell/PKGBUILD syntax damage before compiling anything.
          bash -n "$pkgbuild"

          # Ensure makepkg can parse the rendered metadata.
          su builduser -c "
            cd '$GITHUB_WORKSPACE/build/noctalia-custom'
            makepkg --printsrcinfo > .SRCINFO
          "

          cp \
            build/noctalia-custom/.SRCINFO \
            evidence/rendered-SRCINFO

          # Verify every declared runtime/build dependency is actually
          # present in the CI image before makepkg spends time compiling.
          mapfile -t declared_deps < <(
            bash -c '
              source "$1"
              printf "%s\n" \
                "${depends[@]}" \
                "${makedepends[@]}"
            ' _ "$pkgbuild"
          )

          missing="$(
            pacman -T "${declared_deps[@]}" || true
          )"

          if [[ -n "$missing" ]]; then
            echo "CI image is missing declared PKGBUILD dependencies:" >&2
            printf '%s\n' "$missing" >&2
            exit 1
          fi

      - name: Build Pacman package
        run: |
          set -euo pipefail

          su builduser -c "
            cd '$GITHUB_WORKSPACE/build/noctalia-custom'
            makepkg --noconfirm --clean --cleanbuild
          "

      - name: Inspect candidate package
        run: |
          set -euo pipefail

          mkdir -p candidate evidence/package-root

          pkg="$(
            find build/noctalia-custom \
              -maxdepth 1 \
              -type f \
              -name 'noctalia-custom-*.pkg.tar.zst' \
              -print -quit
          )"

          test -n "$pkg"

          package_file="$(basename "$pkg")"
          cp "$pkg" candidate/

          pacman -Qip "$pkg" \
            | tee evidence/package-info.txt

          pacman -Qlp "$pkg" \
            > evidence/pacman-package-files.txt

          bsdtar -tf "$pkg" \
            | sed 's#^\./##' \
            | tee evidence/package-files.txt

          bsdtar -xOf "$pkg" .PKGINFO \
            > evidence/PKGINFO

          if ! grep -Fxq \
            'license = MIT AND Apache-2.0' \
            evidence/PKGINFO
          then
            echo "Package license metadata is incomplete or unexpected" >&2
            cat evidence/PKGINFO >&2
            exit 1
          fi

          required_files=(
            usr/bin/noctalia
            usr/share/licenses/noctalia-custom/LICENSE
            usr/share/licenses/noctalia-custom/fzy-LICENSE
            usr/share/licenses/noctalia-custom/Luau-LICENSE
            usr/share/licenses/noctalia-custom/Lua-LICENSE
            usr/share/licenses/noctalia-custom/Material-Color-Utilities-LICENSE
            usr/share/licenses/noctalia-custom/Wuffs-LICENSE-APACHE
            usr/share/licenses/noctalia-custom/Wuffs-LICENSE-MIT
            usr/share/licenses/noctalia-custom/Tabler-Icons-LICENSE
            usr/share/doc/noctalia-custom/CREDITS.md
          )

          for required in "${required_files[@]}"; do
            if ! grep -Fxq "$required" evidence/package-files.txt; then
              echo "Required package file missing: $required" >&2
              exit 1
            fi
          done

          bsdtar -xf "$pkg" \
            -C evidence/package-root

          file evidence/package-root/usr/bin/noctalia \
            > evidence/noctalia-file.txt

          if grep -q 'ELF' evidence/noctalia-file.txt; then
            ldd evidence/package-root/usr/bin/noctalia \
              > evidence/ldd.txt

            if grep -q 'not found' evidence/ldd.txt; then
              echo "Unresolved runtime linkage detected" >&2
              cat evidence/ldd.txt >&2
              exit 1
            fi
          fi

          notice_pairs=(
            "LICENSE|usr/share/licenses/noctalia-custom/LICENSE"
            "third_party/fzy/LICENSE|usr/share/licenses/noctalia-custom/fzy-LICENSE"
            "third_party/luau/LICENSE.txt|usr/share/licenses/noctalia-custom/Luau-LICENSE"
            "third_party/luau/lua_LICENSE.txt|usr/share/licenses/noctalia-custom/Lua-LICENSE"
            "third_party/material_color_utilities/LICENSE|usr/share/licenses/noctalia-custom/Material-Color-Utilities-LICENSE"
            "third_party/wuffs/LICENSE-APACHE|usr/share/licenses/noctalia-custom/Wuffs-LICENSE-APACHE"
            "third_party/wuffs/LICENSE-MIT|usr/share/licenses/noctalia-custom/Wuffs-LICENSE-MIT"
            "assets/fonts/tabler-icons-license.txt|usr/share/licenses/noctalia-custom/Tabler-Icons-LICENSE"
            "CREDITS.md|usr/share/doc/noctalia-custom/CREDITS.md"
          )

          for pair in "${notice_pairs[@]}"; do
            IFS='|' read -r source_notice packaged_notice <<< "$pair"

            cmp \
              "source/noctalia/$source_notice" \
              "evidence/package-root/$packaged_notice"
          done

          namcap build/noctalia-custom/PKGBUILD \
            > evidence/namcap-PKGBUILD.txt \
            2>&1 || true

          namcap "$pkg" \
            > evidence/namcap-package.txt \
            2>&1 || true

          if grep -Eq ' E: ' \
            evidence/namcap-PKGBUILD.txt \
            evidence/namcap-package.txt
          then
            echo "Namcap reported package errors" >&2
            cat evidence/namcap-PKGBUILD.txt >&2
            cat evidence/namcap-package.txt >&2
            exit 1
          fi

          package_sha256="$(
            sha256sum "$pkg" \
              | awk '{print $1}'
          )"

          printf '%s  %s\n' \
            "$package_sha256" \
            "$package_file" \
            > evidence/package-SHA256SUMS

          {
            echo "PACKAGE_FILE=$package_file"
            echo "PACKAGE_SHA256=$package_sha256"
          } >> "$GITHUB_ENV"

      - name: Build, test, and lint source
        run: |
          set -euo pipefail

          su builduser -c "
            cd '$GITHUB_WORKSPACE/source/noctalia'
            just build
            just test debug --print-errorlogs
            just lint
          "

      - name: Candidate summary
        run: |
          {
            echo '## noctalia-custom unsigned candidate'
            echo
            echo "- Requested source: \`${{ inputs.source_ref }}\`"
            echo "- Upstream base tag: \`${BASE_TAG}\`"
            echo "- Exact source commit: \`${SOURCE_SHA}\`"
            echo "- Source SHA-256: \`${SOURCE_SHA256}\`"
            echo "- Package: \`${PACKAGE_FILE}\`"
            echo "- Package SHA-256: \`${PACKAGE_SHA256}\`"
            echo "- Signed: **NO**"
            echo "- Published: **NO**"
            echo
            echo '### Custom delta'
            echo
            sed 's/^/- /' evidence/custom-diff-stat.txt
            echo
            echo '### Sensitive-area filename matches'
            echo

            if [[ -s evidence/sensitive-files.txt ]]; then
              sed 's/^/- `/' evidence/sensitive-files.txt \
                | sed 's/$/`/'
            else
              echo '- None detected by filename heuristic'
            fi

            echo
            echo '- License/attribution package checks: **PASSED**'
            echo
            echo '**READY FOR HUMAN SIGNING APPROVAL**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: noctalia-custom-${{ github.run_id }}-candidate
          path: |
            candidate/
            evidence/
          if-no-files-found: error
          retention-days: 7

  approval-ready:
    name: Notify signing approval ready
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Send Pushover approval notification
        env:
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail

          test -n "$PUSHOVER_APP_TOKEN"
          test -n "$PUSHOVER_USER_KEY"

          curl \
            --fail \
            --silent \
            --show-error \
            --form-string "token=$PUSHOVER_APP_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=Package approval required" \
            --form-string \
              "message=noctalia-custom ${SOURCE_REF} passed validation and is ready for signing approval." \
            --form-string \
              "url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --form-string "url_title=Review deployment" \
            https://api.pushover.net/1/messages.json

          echo 'Pushover signing-approval notification sent.' \
            >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Sign and publish approved candidate
    needs:
      - validate
      - approval-ready

    runs-on: ubuntu-latest

    environment:
      name: arch-repo-publish

    permissions:
      contents: write

    concurrency:
      group: arch-repo-publish
      cancel-in-progress: false

    container:
      image: archlinux:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Install publishing dependencies
        run: |
          set -euo pipefail

          pacman -Syu --noconfirm --needed \
            git \
            github-cli \
            gnupg

      - name: Checkout package infrastructure
        uses: actions/checkout@v6

      - name: Trust checked-out repository
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download exact validated candidate
        uses: actions/download-artifact@v8
        with:
          name: noctalia-custom-${{ github.run_id }}-candidate
          path: validated

      - name: Verify validated candidate
        run: |
          set -euo pipefail

          checksum_file="validated/evidence/package-SHA256SUMS"
          test -s "$checksum_file"

          read -r expected_sha package_file < "$checksum_file"

          case "$package_file" in
            noctalia-custom-*.pkg.tar.zst)
              ;;
            *)
              echo "Unexpected package filename: $package_file" >&2
              exit 1
              ;;
          esac

          pkg="validated/candidate/${package_file}"
          test -f "$pkg"

          actual_sha="$(
            sha256sum "$pkg" \
              | awk '{print $1}'
          )"

          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "Validated package SHA-256 mismatch" >&2
            echo "Expected: $expected_sha" >&2
            echo "Actual:   $actual_sha" >&2
            exit 1
          fi

          mkdir -p package-output
          cp "$pkg" package-output/

          {
            echo "PACKAGE_FILE=$package_file"
            echo "PACKAGE_SHA256=$actual_sha"
          } >> "$GITHUB_ENV"

      - name: Import repository signing subkey
        env:
          ARCH_REPO_SIGNING_KEY: ${{ secrets.ARCH_REPO_SIGNING_KEY }}
        run: |
          set -euo pipefail

          test -n "$ARCH_REPO_SIGNING_KEY"

          printf '%s\n' "$ARCH_REPO_SIGNING_KEY" \
            | gpg --batch --import

          gpg --batch --list-secret-keys "$SIGNING_SUBKEY"

      - name: Sign approved package
        env:
          ARCH_REPO_SIGNING_PASSPHRASE: ${{ secrets.ARCH_REPO_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail

          pkg="package-output/${PACKAGE_FILE}"

          printf '%s' "$ARCH_REPO_SIGNING_PASSPHRASE" \
            | gpg \
                --batch \
                --yes \
                --pinentry-mode loopback \
                --passphrase-fd 0 \
                --local-user "${SIGNING_SUBKEY}!" \
                --output "${pkg}.sig" \
                --detach-sign \
                "$pkg"

          gpg --verify "${pkg}.sig" "$pkg"

      - name: Assemble signed repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCH_REPO_SIGNING_PASSPHRASE: ${{ secrets.ARCH_REPO_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail

          mkdir -p repo-output

          # The rolling repository must already exist. A GitHub/API error
          # must never masquerade as an empty repository.
          gh release view "$RELEASE_TAG" >/dev/null

          gh release download "$RELEASE_TAG" \
            --pattern '*.pkg.tar.zst' \
            --pattern '*.pkg.tar.zst.sig' \
            --dir repo-output

          # Verify every package already trusted by the repository before
          # using it to construct the next repository state.
          shopt -s nullglob
          existing_packages=( repo-output/*.pkg.tar.zst )

          for existing_pkg in "${existing_packages[@]}"; do
            existing_sig="${existing_pkg}.sig"

            if [[ ! -f "$existing_sig" ]]; then
              echo "Existing repository package lacks signature: $existing_pkg" >&2
              exit 1
            fi

            gpg --verify "$existing_sig" "$existing_pkg"
          done

          # This workflow owns the current noctalia-custom package version.
          rm -f \
            repo-output/noctalia-custom-*.pkg.tar.zst \
            repo-output/noctalia-custom-*.pkg.tar.zst.sig

          cp "package-output/${PACKAGE_FILE}" repo-output/
          cp "package-output/${PACKAGE_FILE}.sig" repo-output/

          cd repo-output

          shopt -s nullglob
          packages=( *.pkg.tar.zst )

          if (( ${#packages[@]} == 0 )); then
            echo "No Pacman packages available for repository database" >&2
            exit 1
          fi

          repo-add \
            --include-sigs \
            "${REPO_NAME}.db.tar.zst" \
            "${packages[@]}"

          rm -f "${REPO_NAME}.db" "${REPO_NAME}.files"

          cp -L "${REPO_NAME}.db.tar.zst" "${REPO_NAME}.db"
          cp -L "${REPO_NAME}.files.tar.zst" "${REPO_NAME}.files"

          rm -f \
            "${REPO_NAME}.db.tar.zst" \
            "${REPO_NAME}.files.tar.zst"

          sign_file() {
            local file="$1"

            printf '%s' "$ARCH_REPO_SIGNING_PASSPHRASE" \
              | gpg \
                  --batch \
                  --yes \
                  --pinentry-mode loopback \
                  --passphrase-fd 0 \
                  --local-user "${SIGNING_SUBKEY}!" \
                  --output "${file}.sig" \
                  --detach-sign \
                  "$file"

            gpg --verify "${file}.sig" "$file"
          }

          sign_file "${REPO_NAME}.db"
          sign_file "${REPO_NAME}.files"

          cp \
            "$GITHUB_WORKSPACE/arch/keys/t4t3z0r-package-signing.asc" \
            .

          mapfile -d '' checksum_files < <(
            find . \
              -maxdepth 1 \
              -type f \
              ! -name SHA256SUMS \
              -printf '%f\0' \
              | sort -z
          )

          if (( ${#checksum_files[@]} == 0 )); then
            echo "No repository assets available for checksums" >&2
            exit 1
          fi

          sha256sum "${checksum_files[@]}" \
            > SHA256SUMS

      - name: Publish rolling Arch repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh release view "$RELEASE_TAG" >/dev/null

          # Package first. Existing clients remain on the old valid database
          # until the new repository metadata is successfully published.
          gh release upload "$RELEASE_TAG" \
            "repo-output/${PACKAGE_FILE}" \
            "repo-output/${PACKAGE_FILE}.sig" \
            --clobber

          gh release upload "$RELEASE_TAG" \
            repo-output/t4t3z0r-package-signing.asc \
            repo-output/SHA256SUMS \
            repo-output/t4t3z0r.files \
            repo-output/t4t3z0r.files.sig \
            --clobber

          # Database last.
          gh release upload "$RELEASE_TAG" \
            repo-output/t4t3z0r.db \
            repo-output/t4t3z0r.db.sig \
            --clobber

          mapfile -t desired < <(
            find repo-output \
              -maxdepth 1 \
              -type f \
              -printf '%f\n' \
              | sort
          )

          mapfile -t existing < <(
            gh release view "$RELEASE_TAG" \
              --json assets \
              --jq '.assets[].name'
          )

          for asset in "${existing[@]}"; do
            if ! printf '%s\n' "${desired[@]}" \
              | grep -Fxq -- "$asset"
            then
              gh release delete-asset \
                "$RELEASE_TAG" \
                "$asset" \
                --yes
            fi
          done

      - name: Publication summary
        run: |
          {
            echo '## Published noctalia-custom'
            echo
            echo "- Requested source: \`${{ inputs.source_ref }}\`"
            echo "- Package: \`${PACKAGE_FILE}\`"
            echo "- Package SHA-256: \`${PACKAGE_SHA256}\`"
            echo "- Repository: \`${REPO_NAME}\`"
            echo '- Human signing approval: **PASSED**'
            echo '- Package and repository databases signed'
          } >> "$GITHUB_STEP_SUMMARY"
