name: Check package upstream updates

on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * *'

permissions:
  contents: read
  issues: read

concurrency:
  group: check-package-upstream
  cancel-in-progress: false

jobs:
  discover:
    name: Report approved upstream updates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Install discovery dependencies
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed python git github-cli
          command -v vercmp

      - name: Checkout package infrastructure
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Discover upstream candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/package-pipeline/validate_manifest.py
          python3 scripts/package-pipeline/report_upstream.py |
            tee upstream-report.json

      - name: Summarize discovery results
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          results = json.loads(
              Path("upstream-report.json").read_text()
          )

          lines = [
              "## Upstream package discovery",
              "",
              "| Package | Status | Selected | Candidate |",
              "|---|---|---|---|",
          ]

          for item in results:
              lines.append(
                  f"| {item['package']} "
                  f"| {item['status']} "
                  f"| `{item['selected']}` "
                  f"| `{item['candidate']}` |"
              )

          lines.extend([
              "",
              "Discovery only. No package selections changed.",
              "No builds, signing, or publication requested.",
          ])

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8",
          ) as summary:
              summary.write("\n".join(lines) + "\n")

          print("\n".join(lines))
          PY

      - name: Evaluate candidate review history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 scripts/package-pipeline/run_candidate_reviews.py \
            upstream-report.json | tee candidate-review.json

          python3 - <<'SUMMARY'
          import json
          import os
          from pathlib import Path

          results = json.loads(
              Path("candidate-review.json").read_text()
          )

          lines = [
              "## Candidate review decisions",
              "",
              "| Package | Candidate | Decision |",
              "|---|---|---|",
          ]

          for item in results:
              lines.append(
                  f"| {item['package']} "
                  f"| `{item['candidate']}` "
                  f"| {item['action']} |"
              )

          if not results:
              lines.append(
                  "| None | None | No new candidates |"
              )

          lines.extend([
              "",
              "This discovery job is read-only.",
              "A separate job may create review issues "
              "on scheduled runs.",
          ])

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write("\n".join(lines) + "\n")
          SUMMARY

      - name: Upload discovery report
        uses: actions/upload-artifact@v4
        with:
          name: upstream-report-${{ github.run_id }}
          path: |
            upstream-report.json
            candidate-review.json
          if-no-files-found: error
          retention-days: 7

  write-reviews:
    name: Create and verify scheduled candidate reviews
    if: ${{ github.repository == 'T4T3Z0R/packages' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule') }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      issues: write

    concurrency:
      group: package-candidate-issue-writes
      cancel-in-progress: false
      queue: max

    container:
      image: archlinux:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Verify scheduled authorization
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = schedule
          test "$GITHUB_REPOSITORY" = T4T3Z0R/packages
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1

      - name: Install discovery dependencies
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed python git github-cli
          command -v vercmp

      - name: Checkout production source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify production revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(
            git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD
          )" = "$GITHUB_SHA"

          test "$(
            gh api "repos/$GITHUB_REPOSITORY/branches/main" \
              --jq .commit.sha
          )" = "$GITHUB_SHA"

          python3 scripts/package-pipeline/validate_manifest.py

      - name: Download discovery evidence
        uses: actions/download-artifact@v8
        with:
          name: upstream-report-${{ github.run_id }}
          path: scheduled-input

      - name: Verify discovery evidence exists
        run: |
          set -euo pipefail
          test -s scheduled-input/upstream-report.json
          test -s scheduled-input/candidate-review.json

          cp scheduled-input/upstream-report.json \
            upstream-report.json

          cp scheduled-input/candidate-review.json \
            prewrite-review.json

      - name: Revalidate upstream before candidate writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          test "$(
            gh api "repos/$GITHUB_REPOSITORY/branches/main" \
              --jq .commit.sha
          )" = "$GITHUB_SHA"

          python3 scripts/package-pipeline/report_upstream.py \
            > fresh-upstream-report.json

          python3 scripts/package-pipeline/verify_scheduled_snapshot.py \
            upstream-report.json fresh-upstream-report.json

      - name: Create missing reviews with fresh history checks
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ISSUE_WRITE_ENABLED: "1"
        run: |
          set -euo pipefail
          python3 scripts/package-pipeline/run_candidate_reviews.py \
            upstream-report.json --create |
            tee issue-write-result.json

      - name: Verify every issue against current GitHub history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/package-pipeline/verify_candidate_batch.py \
            upstream-report.json \
            prewrite-review.json \
            issue-write-result.json \
            created-review-issues.json

          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          created = json.loads(
              Path("created-review-issues.json").read_text()
          )

          assert isinstance(created, list)

          lines = [
              "## Scheduled candidate review writes",
              "",
              f"Verified new issues: **{len(created)}**",
              "",
          ]

          for item in created:
              lines.append(
                  f"- `{item['package']}` "
                  f"`{item['candidate']}`: "
                  f"#{item['issue_number']}"
              )

          lines.extend([
              "",
              "No source selections, builds, signing, or publication performed.",
              "Notifications use a separately guarded step.",
          ])

          summary = "\n".join(lines) + "\n"

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(summary)

          print(summary)
          PYTHON

      - name: Notify verified new candidate reviews
        env:
          GH_TOKEN: ${{ github.token }}
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          CANDIDATE_NOTIFICATION_WRITE_ENABLED: "1"
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = schedule
          test "$GITHUB_REPOSITORY" = T4T3Z0R/packages
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(
            gh api "repos/$GITHUB_REPOSITORY/branches/main" \
              --jq .commit.sha
          )" = "$GITHUB_SHA"

          python3 scripts/package-pipeline/candidate_notification_io.py \
            created-review-issues.json | tee notification-result.json

      - name: Upload scheduled review evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-candidate-reviews-${{ github.run_id }}
          path: |
            upstream-report.json
            prewrite-review.json
            issue-write-result.json
            created-review-issues.json
            notification-result.json
          if-no-files-found: warn
          retention-days: 7
