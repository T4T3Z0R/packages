name: Create package candidate review issue

on:
  workflow_dispatch:
    inputs:
      package:
        description: Approved package requiring review
        required: true
        type: choice
        options:
          - gameshell
          - ghostty
          - keepassxc
          - moonlight-qt
          - yazi
          - noctalia-custom
          - noctalia-greeter-t4t3z0r
          - syncthing
          - wezterm
      candidate:
        description: Exact current upstream tag or commit
        required: true
        type: string
      confirmation:
        description: Type CREATE REVIEW ISSUE exactly
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-candidate-issue-writes
  cancel-in-progress: false
  queue: max

jobs:
  create-review:
    name: Create or reuse one candidate review issue
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    container:
      image: archlinux:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Verify explicit owner authorization
        env:
          REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REPOSITORY" = T4T3Z0R/packages
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = T4T3Z0R
          test "$GITHUB_TRIGGERING_ACTOR" = T4T3Z0R
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$REQUESTED_CONFIRMATION" = 'CREATE REVIEW ISSUE'

      - name: Install discovery dependencies
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed python git github-cli curl
          command -v curl
          command -v vercmp

      - name: Checkout default-branch source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify checkout and package manifest
        run: |
          set -euo pipefail
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/package-pipeline/validate_manifest.py

      - name: Discover and select exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_PACKAGE: ${{ inputs.package }}
          REQUESTED_CANDIDATE: ${{ inputs.candidate }}
        run: |
          set -euo pipefail
          python3 scripts/package-pipeline/report_upstream.py |
            tee upstream-report.json
          python3 scripts/package-pipeline/select_candidate_write.py \
            upstream-report.json \
            --package "$REQUESTED_PACKAGE" \
            --candidate "$REQUESTED_CANDIDATE" \
            > selected-report.json
          python3 scripts/package-pipeline/run_candidate_reviews.py \
            selected-report.json | tee prewrite-review.json

      - name: Create missing candidate review once
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ISSUE_WRITE_ENABLED: "1"
        run: |
          set -euo pipefail
          python3 scripts/package-pipeline/run_candidate_reviews.py \
            selected-report.json --create | tee issue-write-result.json

      - name: Verify issue history after write
        id: verify_review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/package-pipeline/verify_candidate_write.py \
            selected-report.json \
            prewrite-review.json \
            issue-write-result.json \
            postwrite-review.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def load(filename):
              content = json.loads(Path(filename).read_text())
              assert isinstance(content, list) and len(content) == 1
              return content[0]

          before = load("prewrite-review.json")
          write = load("issue-write-result.json")
          after = load("postwrite-review.json")

          assert before["package"] == write["package"] == after["package"]
          assert before["candidate"] == write["candidate"] == after["candidate"]
          assert write["action"] in ("created", "existing")
          assert type(write["issue_number"]) is int
          assert write["issue_number"] > 0
          assert after["issue_number"] == write["issue_number"]

          if write["action"] == "created":
              assert before["action"] == "create"
              assert after["action"] == "pending"
          else:
              assert after["action"] == write["decision"]
              if before["action"] != "create":
                  assert before["issue_number"] == write["issue_number"]

          if write["action"] == "created":
              with open(
                  os.environ["GITHUB_OUTPUT"],
                  "a",
                  encoding="utf-8",
              ) as output:
                  output.write(
                      f"created_issue_number={write['issue_number']}\n"
                  )

          summary = (
              "## Manual package candidate review\n\n"
              f"Package: `{write['package']}`\n\n"
              f"Candidate: `{write['candidate']}`\n\n"
              f"Result: **{write['action']}**\n\n"
              f"Issue: #{write['issue_number']}\n\n"
              "No source selection, builds, signing, or publication.\n"
          )

          with open(
              os.environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(summary)

          print(summary)
          PY

      - name: Notify new candidate review via Pushover
        if: ${{ steps.verify_review.outputs.created_issue_number != '' }}
        env:
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          ISSUE_NUMBER: ${{ steps.verify_review.outputs.created_issue_number }}
          REQUESTED_PACKAGE: ${{ inputs.package }}
          REQUESTED_CANDIDATE: ${{ inputs.candidate }}
        run: |
          set -euo pipefail

          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REPOSITORY" = T4T3Z0R/packages

          test -n "$PUSHOVER_APP_TOKEN"
          test -n "$PUSHOVER_USER_KEY"

          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$REQUESTED_PACKAGE" =~ ^(gameshell|ghostty|keepassxc|moonlight-qt|noctalia-custom|noctalia-greeter-t4t3z0r|syncthing|wezterm|yazi)$ ]]
          [[ "$REQUESTED_CANDIDATE" =~ ^[A-Za-z0-9._+-]{1,100}$ ]]

          curl --fail --silent --show-error \
            --form-string "token=$PUSHOVER_APP_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string 'title=Package candidate review required' \
            --form-string "message=${REQUESTED_PACKAGE} candidate ${REQUESTED_CANDIDATE} needs manual review. No build or publication authorized." \
            --form-string "url=https://github.com/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" \
            --form-string 'url_title=Open candidate review' \
            https://api.pushover.net/1/messages.json

      - name: Upload review evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: candidate-review-write-${{ github.run_id }}
          path: |
            upstream-report.json
            selected-report.json
            prewrite-review.json
            issue-write-result.json
            postwrite-review.json
          if-no-files-found: error
          retention-days: 7
