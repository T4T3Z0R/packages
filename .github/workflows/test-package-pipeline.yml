name: Test shared package pipeline

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Exact commit requiring pipeline validation
        required: true
        type: string
  push:
    branches:
      - feature/shared-package-pipeline
      - feature/shared-noctalia-custom
      - feature/shared-gameshell
      - feature/unified-release-lifecycle
      - fix/fixed-recipe-source-selection
      - feature/moonlight-qt
      - feature/yazi-package
      - feature/broot-package
      - feature/thunar-package
      - feature/mousepad-package
      - feature/engrampa-package
    paths:
      - "scripts/package-pipeline/**"
      - "tests/package-pipeline/**"
      - "arch/packages/**"
      - ".github/workflows/test-package-pipeline.yml"
      - ".github/workflows/maintain-package-history.yml"
      - ".github/workflows/package-validation-controller.yml"
      - ".github/workflows/review-package-candidate-approval.yml"
      - ".github/workflows/check-package-upstream.yml"
      - ".github/workflows/create-package-candidate-review.yml"
      - ".github/workflows/reconcile-package-candidates.yml"
      - ".github/workflows/publish-noctalia-greeter.yml"
      - ".github/workflows/publish-noctalia-custom.yml"
      - ".github/workflows/publish-gameshell.yml"
      - ".github/workflows/publish-wezterm.yml"
      - ".github/workflows/publish-moonlight-qt.yml"
      - ".github/workflows/publish-yazi.yml"
      - ".github/workflows/publish-broot.yml"
      - ".github/workflows/publish-thunar.yml"
      - ".github/workflows/publish-mousepad.yml"
      - ".github/workflows/publish-engrampa.yml"
      - ".github/workflows/publish-ghostty.yml"
      - ".github/workflows/publish-keepassxc.yml"
      - ".github/workflows/publish-syncthing.yml"
      - "arch/ghostty/**"
      - "arch/gameshell/**"
      - "arch/keepassxc/**"
      - "arch/noctalia-custom/**"
      - "arch/noctalia-greeter-t4t3z0r/**"
      - "arch/syncthing/**"
      - "arch/wezterm/**"
      - "arch/moonlight-qt/**"
      - "arch/yazi/**"
      - "arch/broot/**"
      - "arch/thunar/**"
      - "arch/mousepad/**"
      - "arch/engrampa/**"
  pull_request:
    paths:
      - "scripts/package-pipeline/**"
      - "tests/package-pipeline/**"
      - "arch/packages/**"
      - ".github/workflows/test-package-pipeline.yml"
      - ".github/workflows/maintain-package-history.yml"
      - ".github/workflows/package-validation-controller.yml"
      - ".github/workflows/review-package-candidate-approval.yml"
      - ".github/workflows/check-package-upstream.yml"
      - ".github/workflows/create-package-candidate-review.yml"
      - ".github/workflows/reconcile-package-candidates.yml"
      - ".github/workflows/publish-noctalia-greeter.yml"
      - ".github/workflows/publish-noctalia-custom.yml"
      - ".github/workflows/publish-gameshell.yml"
      - ".github/workflows/publish-wezterm.yml"
      - ".github/workflows/publish-moonlight-qt.yml"
      - ".github/workflows/publish-yazi.yml"
      - ".github/workflows/publish-broot.yml"
      - ".github/workflows/publish-thunar.yml"
      - ".github/workflows/publish-mousepad.yml"
      - ".github/workflows/publish-engrampa.yml"
      - ".github/workflows/publish-ghostty.yml"
      - ".github/workflows/publish-keepassxc.yml"
      - ".github/workflows/publish-syncthing.yml"
      - "arch/ghostty/**"
      - "arch/gameshell/**"
      - "arch/keepassxc/**"
      - "arch/noctalia-custom/**"
      - "arch/noctalia-greeter-t4t3z0r/**"
      - "arch/syncthing/**"
      - "arch/wezterm/**"
      - "arch/moonlight-qt/**"
      - "arch/yazi/**"
      - "arch/broot/**"
      - "arch/thunar/**"
      - "arch/mousepad/**"
      - "arch/engrampa/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate package pipeline
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Verify dispatched revision
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = T4T3Z0R/packages
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_REVISION"

      - name: Install test dependencies
        run: pacman -Syu --noconfirm --needed python bash git gnupg libarchive zstd diffutils jq base-devel gawk gettext

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify package tooling
        run: |
          set -eu
          for tool in bash python git gpg bsdtar zstd repo-add repo-remove makepkg diff; do
            command -v "$tool" >/dev/null
            echo "PASS: $tool"
          done

          # The Arch container and checkout can have different owners.
          # Trust only this workflow's checkout, not every repository.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree >/dev/null

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify shell syntax
        run: bash -n scripts/package-pipeline/assemble-repository.sh scripts/package-pipeline/publish-repository.sh

      - name: Validate manifest
        run: python scripts/package-pipeline/validate_manifest.py

      - name: Run unit tests
        run: python -m unittest discover -s tests/package-pipeline -p "test_assembly.py" -v && python -m unittest discover -s tests/package-pipeline -p "test_manifest.py" -v && python -m unittest discover -s tests/package-pipeline -p "test_noctalia_namcap.py" -v && python -m unittest discover -s tests/package-pipeline -p "test_workflow_parity.py" -v

      - name: Validate release policies and candidate decisions
        run: |
          set -euo pipefail
          command -v vercmp
          python scripts/package-pipeline/validate_manifest.py
          python -m unittest discover -s tests/package-pipeline -p 'test_manifest.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_release_candidates.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_upstream_discovery.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_upstream_checker.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_upstream_report.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_package_selection.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_package_release_contract.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_seven_package_validation.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_package_fingerprint.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_validation_ledger.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_github_validation_history.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_evaluate_validation.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_candidate_review.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_candidate_approval_event.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_candidate_selection_handoff.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_candidate_selection_pr_writer.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_selection_ci_dispatch.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_selection_ci_behavior.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_fixed_recipe_selection.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_fixed_recipe_metadata.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_generated_recipe_metadata.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_generated_recipe_workflows.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_native_dependency_metadata.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_build_workspace_boundary.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_gameshell_archive_intake.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_merged_selection_validation.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_dispatch_unsigned_validation.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_release_approval_policy.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_release_approval_dispatch.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_candidate_issue_state.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_reconcile_candidate_publication.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_close_published_candidates.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_github_candidate_issues.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_create_candidate_issue.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_github_candidate_writer.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_run_candidate_reviews.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_select_candidate_write.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_candidate_write_workflow.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_verify_candidate_write.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_verify_candidate_batch.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_scheduled_candidate_workflow.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_verify_scheduled_snapshot.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_candidate_notification_state.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_candidate_notification_reader.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_candidate_notification_dispatch.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_candidate_notification_receipt.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_candidate_notification_io.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_scheduled_candidate_notification_workflow.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_source_contract.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_yazi_package.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_broot_package.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_xfce_source.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_thunar_package.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_mousepad_package.py' -v
          python -m unittest discover -s tests/package-pipeline -p 'test_engrampa_package.py' -v
          for package in ghostty keepassxc syncthing wezterm moonlight-qt yazi broot thunar mousepad engrampa; do
            python scripts/package-pipeline/verify_source_contract.py --package "$package"
          done

      - name: Verify native fixed-recipe metadata parity
        run: |
          set -euo pipefail

          command -v makepkg
          command -v vercmp
          command -v curl
          command -v runuser

          scratch="$(mktemp -d)"
          trap 'rm -rf -- "$scratch"' EXIT

          useradd --create-home metadata-test

          chmod 0711 "$scratch"
          install -d -m 0755 "$scratch/input"

          install -m 0644 \
            scripts/package-pipeline/fixed_recipe_metadata.py \
            scripts/package-pipeline/fixed_recipe_selection.py \
            scripts/package-pipeline/verify_source_contract.py \
            scripts/package-pipeline/resolve_candidate.py \
            scripts/package-pipeline/xfce_source.py \
            scripts/package-pipeline/mate_source.py \
            "$scratch/input/"

          python3 - "$scratch/input" <<'PYTHON'
          import json
          import re
          import sys
          from pathlib import Path

          output = Path(sys.argv[1])

          manifest = json.loads(
              Path("arch/packages/manifest.json").read_text()
          )

          expected = {}

          for package in (
              "ghostty", "keepassxc", "syncthing", "wezterm",
              "moonlight-qt", "yazi", "broot", "thunar", "mousepad",
              "engrampa",
          ):
              config = manifest["packages"][package]
              source = Path(config["recipe"]).read_text()

              version = re.findall(
                  r"^pkgver=([^\s]+)$",
                  source,
                  re.MULTILINE,
              )

              assert len(version) == 1, package

              expected[package] = {
                  "candidate": config["source_ref"],
                  "pkgver": version[0],
              }

              if package != "wezterm":
                  if package == "engrampa":
                      algorithm = "b2"
                      digest = re.findall(
                          r"^b2sums=\(\n  ([0-9a-f]{128})\n"
                          r"  SKIP\n  [0-9a-f]{128}\n\)$",
                          source,
                          re.MULTILINE,
                      )
                  else:
                      algorithm = (
                          "sha512" if package == "moonlight-qt"
                          else "sha256"
                      )
                      length = 128 if algorithm == "sha512" else 64
                      digest = re.findall(
                          rf"^{algorithm}sums=\('([0-9a-f]{{{length}}})'",
                          source,
                          re.MULTILINE,
                      )
                  assert len(digest) == 1, package
                  expected[package]["algorithm"] = algorithm
                  expected[package]["checksum"] = digest[0]

          (output / "expected.json").write_text(
              json.dumps(expected)
          )
          (output / "manifest.json").write_text(
              json.dumps(manifest)
          )
          PYTHON

          chmod 0644 "$scratch/input/"*.json

          (
            cd /home/metadata-test

            runuser -u metadata-test -- \
              env -i \
              HOME=/home/metadata-test \
              USER=metadata-test \
              LOGNAME=metadata-test \
              PATH=/usr/bin:/bin \
              LANG=C.UTF-8 \
              PYTHONPATH="$scratch/input" \
              python3 - "$scratch/input" <<'PYTHON'
          import json
          import sys
          from pathlib import Path

          from fixed_recipe_metadata import (
              archive_checksum,
              keepassxc_checksum,
              thunar_checksum,
              mousepad_checksum,
              engrampa_checksum,
              wezterm_version,
          )

          import xfce_source
          import mate_source
          from resolve_candidate import decide

          for candidate, status in (
              ("thunar-4.20.11", "update"),
              ("thunar-4.22.0", "update"),
              ("thunar-4.20.9", "blocked"),
              ("thunar-4.20.10", "unchanged"),
          ):
              result = decide(
                  xfce_source.POLICY,
                  "thunar-4.20.10",
                  candidate,
              )
              assert result["status"] == status, result

          print("PASS: XFCE native version comparison", flush=True)

          for candidate, status in (
              ("v1.28.6", "update"),
              ("v1.30.0", "update"),
              ("v1.28.4", "blocked"),
              ("v1.28.5", "unchanged"),
          ):
              result = decide(
                  mate_source.POLICY,
                  "v1.28.5",
                  candidate,
              )
              assert result["status"] == status, result

          print("PASS: MATE native version comparison", flush=True)

          root = Path(sys.argv[1])
          expected = json.loads(
              (root / "expected.json").read_text()
          )

          for package, reference in expected.items():
              version = reference["pkgver"]

              if package == "wezterm":
                  actual = wezterm_version(
                      reference["candidate"]
                  )

                  assert actual == version, (
                      package, actual, version
                  )

                  print(
                      f"PASS: {package} version {actual}",
                      flush=True,
                  )
                  continue

              if package == "keepassxc":
                  actual = keepassxc_checksum(version)
              elif package == "thunar":
                  actual = thunar_checksum(version)
              elif package == "mousepad":
                  actual = mousepad_checksum(version)
              elif package == "engrampa":
                  actual = engrampa_checksum(version)
              else:
                  actual = archive_checksum(
                      package, version
                  )

              assert actual == reference["checksum"], (
                  package,
                  actual,
                  reference["checksum"],
              )

              print(
                  f"PASS: {package} native source checksum",
                  flush=True,
              )
          PYTHON
          )

      - name: Verify native dependency metadata and recipe privileges
        env:
          PACKAGE_PIPELINE_NATIVE_TESTS: "1"
        run: python -m unittest discover -s tests/package-pipeline -p 'test_native_dependency_workflows.py' -v

      - name: Verify native build privilege boundaries
        env:
          PACKAGE_PIPELINE_NATIVE_TESTS: "1"
        run: python -m unittest discover -s tests/package-pipeline -p 'test_native_build_boundaries.py' -v

      - name: Verify native GameShell generation and packaging
        env:
          PACKAGE_PIPELINE_NATIVE_TESTS: "1"
        run: python -m unittest discover -s tests/package-pipeline -p 'test_native_gameshell_generation.py' -v

      - name: Run real-package integration tests
        run: python -m unittest discover -s tests/package-pipeline -p "test_integration.py" -v

      - name: Run publication safety tests
        run: python -m unittest discover -s tests/package-pipeline -p "test_publication.py" -v

      - name: Run retention and archival safety tests
        run: |
          python -m unittest discover -s tests/package-pipeline -p "test_retention.py" -v
          python -m unittest discover -s tests/package-pipeline -p "test_history_publication.py" -v
          python -m unittest discover -s tests/package-pipeline -p "test_history_maintenance.py" -v
          python -m unittest discover -s tests/package-pipeline -p "test_publication_archive_gate.py" -v
