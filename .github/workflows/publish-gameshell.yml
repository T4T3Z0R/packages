name: Publish gameshell
run-name: "GameShell ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || 'latest' }}"

on:
  pull_request:
    paths:
      - 'arch/gameshell/**'
      - '.github/workflows/publish-gameshell.yml'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Upstream GameShell release tag
        required: true
        default: latest
        type: string
      expected_revision:
        description: Exact infrastructure commit expected for unsigned validation
        type: string
        required: false
        default: ""
      publish:
        description: Request protected signing and publication after validation
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  UPSTREAM_REPOSITORY: phyver/GameShell
  PACKAGE_NAME: gameshell
  REPO_NAME: t4t3z0r
  RELEASE_TAG: arch-repo
  SIGNING_SUBKEY: A2A5AEC28C6D94EF2FB3EC75AC3E97B561D89610

jobs:
  detect:
    name: Resolve upstream candidate
    runs-on: ubuntu-latest

    outputs:
      update: ${{ steps.resolve.outputs.update }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      pkgver: ${{ steps.resolve.outputs.pkgver }}
      pkgrel: ${{ steps.resolve.outputs.pkgrel }}
      package_file: ${{ steps.resolve.outputs.package_file }}

    steps:
      - name: Checkout package infrastructure
        uses: actions/checkout@v6

      - name: Verify requested infrastructure revision
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_revision != '' }}
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_REVISION"

      - name: Checkout upstream GameShell
        uses: actions/checkout@v6
        with:
          repository: phyver/GameShell
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || 'latest' }}
          fetch-depth: 0
          path: source/GameShell

      - name: Resolve version and update state
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || 'latest' }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          if [[ ! "$SOURCE_REF" =~ ^[0-9A-Za-z._+-]+$ ]]; then
            echo "Invalid upstream ref: $SOURCE_REF" >&2
            exit 1
          fi

          if ! git -C source/GameShell show-ref \
            --verify --quiet "refs/tags/${SOURCE_REF}"
          then
            echo "Upstream ref is not a tag: $SOURCE_REF" >&2
            exit 1
          fi

          source_sha="$(git -C source/GameShell rev-parse HEAD)"

          python3 scripts/package-pipeline/generated_recipe_metadata.py \
            validate-commit --sha "$source_sha" >/dev/null

          ref_sha="$(
            git -C source/GameShell \
              rev-parse --verify "refs/tags/${SOURCE_REF}^{commit}"
          )"

          if [[ "$source_sha" != "$ref_sha" ]]; then
            echo "Checked-out source does not match requested tag" >&2
            exit 1
          fi

          base_tag="$(
            git -C source/GameShell describe \
              --tags --abbrev=0 --match 'v[0-9]*' "$source_sha"
          )"
          python3 scripts/package-pipeline/generated_recipe_metadata.py \
            gameshell-base-tag --tag "$base_tag" >/dev/null

          revs="$(
            git -C source/GameShell rev-list \
              --count "refs/tags/${base_tag}..${source_sha}"
          )"
          short_sha="$(
            git -C source/GameShell rev-parse --short=12 "$source_sha"
          )"

          pkgver="$(
            python3 scripts/package-pipeline/generated_recipe_metadata.py \
              gameshell-version \
              --tag "$base_tag" \
              --distance "$revs" \
              --source-sha "$source_sha" \
              --abbreviation "$short_sha"
          )"

          pkgrel="$(
            awk -F= '$1 == "pkgrel" { print $2; exit }' \
              arch/gameshell/PKGBUILD.in
          )"
          if [[ ! "$pkgrel" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid pkgrel in PKGBUILD.in: $pkgrel" >&2
            exit 1
          fi

          package_file="gameshell-${pkgver}-${pkgrel}-any.pkg.tar.zst"
          package_exists=false

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              # Always validate recipe changes on a PR, even when this exact
              # package version already exists in the rolling repository.
              update=true
              ;;
            workflow_dispatch)
              case "$REQUESTED_PUBLISH" in
                false)
                  # An unsigned validation is meaningful even when the
                  # identical package version has already been published.
                  update=true
                  ;;
                true)
                  # A failed release-asset query must stop publication.
                  remote_assets="$(
                    gh release view "$RELEASE_TAG" \
                      --repo "$GITHUB_REPOSITORY" \
                      --json assets \
                      --jq '.assets[].name'
                  )"
                  if grep -Fxq "$package_file" <<< "$remote_assets"; then
                    package_exists=true
                    update=false
                  else
                    update=true
                  fi
                  ;;
                *) echo 'Invalid publish intent' >&2; exit 1 ;;
              esac
              ;;
            *)
              echo "Unsupported GameShell event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          {
            echo "source_ref=$SOURCE_REF"
            echo "source_sha=$source_sha"
            echo "pkgver=$pkgver"
            echo "pkgrel=$pkgrel"
            echo "package_file=$package_file"
            echo "update=$update"
          } >> "$GITHUB_OUTPUT"

          {
            echo '## GameShell update check'
            echo
            echo "- Upstream ref: \`$SOURCE_REF\`"
            echo "- Upstream commit: \`$source_sha\`"
            echo "- Package: \`$package_file\`"
            echo "- Existing package: **$package_exists**"
            echo "- Build required: **$update**"
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Validate unsigned candidate
    needs: detect
    if: needs.detect.outputs.update == 'true'
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Install validation dependencies
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed \
            base-devel bash gawk gettext git namcap python

      - name: Checkout package infrastructure
        uses: actions/checkout@v6

      - name: Checkout exact upstream source
        uses: actions/checkout@v6
        with:
          repository: phyver/GameShell
          ref: ${{ needs.detect.outputs.source_sha }}
          fetch-depth: 0
          path: source/GameShell

      - name: Trust checked-out repositories
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory \
            "$GITHUB_WORKSPACE/source/GameShell"

      - name: Verify selected manifest source
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          SOURCE_SHA: ${{ needs.detect.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 scripts/package-pipeline/verify_validation_source.py \
            --package gameshell --source "$SOURCE_SHA"

      - name: Verify mutable upstream tag has not moved
        env:
          SOURCE_REF: ${{ needs.detect.outputs.source_ref }}
          SOURCE_SHA: ${{ needs.detect.outputs.source_sha }}
        run: |
          set -euo pipefail

          git -C source/GameShell fetch --force origin \
            "refs/tags/${SOURCE_REF}:refs/tags/${SOURCE_REF}"

          current_ref_sha="$(
            git -C source/GameShell \
              rev-parse --verify "refs/tags/${SOURCE_REF}^{commit}"
          )"
          checked_out_sha="$(git -C source/GameShell rev-parse HEAD)"

          [[ "$checked_out_sha" == "$SOURCE_SHA" ]]
          if [[ "$current_ref_sha" != "$SOURCE_SHA" ]]; then
            echo "Upstream tag moved after candidate detection." >&2
            echo "Refusing to publish a stale candidate." >&2
            exit 1
          fi

      - name: Generate package sources
        env:
          SOURCE_SHA: ${{ needs.detect.outputs.source_sha }}
          PKGVER: ${{ needs.detect.outputs.pkgver }}
        run: |
          set -euo pipefail

          # Establish protected parents before running upstream code.
          test "$(id -u)" -eq 0
          test "$(git -C source/GameShell rev-parse HEAD)" = "$SOURCE_SHA"

          useradd -m builduser
          test "$(id -u builduser)" -ne 0

          mkdir -m 0755 build candidate evidence
          mkdir -m 0755 build/gameshell build/gameshell-generation

          for protected in \
            "$GITHUB_WORKSPACE" \
            "$GITHUB_WORKSPACE/source" \
            "$GITHUB_WORKSPACE/source/GameShell" \
            "$GITHUB_WORKSPACE/build" \
            "$GITHUB_WORKSPACE/build/gameshell" \
            "$GITHUB_WORKSPACE/candidate" \
            "$GITHUB_WORKSPACE/evidence"
          do
            test -d "$protected"
            test ! -L "$protected"
            test "$(stat -c '%u' "$protected")" = "$(id -u)"
          done

          # Obtain trusted packaging inputs before upstream execution.
          cp source/GameShell/LICENSE build/gameshell/LICENSE
          cp arch/gameshell/gameshell-launcher \
            build/gameshell/gameshell-launcher
          cp arch/gameshell/README.md \
            build/gameshell/README.packaging.md

          git -C source/GameShell archive \
            --format=tar.gz \
            --prefix=GameShell-source/ \
            "$SOURCE_SHA" \
            > build/gameshell/GameShell-source.tar.gz

          tar -tzf build/gameshell/GameShell-source.tar.gz \
            > evidence/source-archive-files.txt

          for required in \
            GameShell-source/LICENSE \
            GameShell-source/start.sh \
            GameShell-source/lib/profile.sh \
            GameShell-source/utils/gameshell_archive.sh
          do
            grep -Fxq "$required" evidence/source-archive-files.txt
          done

          # Preserve Git history without copying checkout configuration.
          git clone --no-local --no-checkout --template= \
            "$GITHUB_WORKSPACE/source/GameShell" \
            build/gameshell-generation/GameShell

          chown -R builduser:builduser build/gameshell-generation

          python3 -I scripts/package-pipeline/build_workspace_boundary.py \
            --user builduser \
            --workspace "$GITHUB_WORKSPACE" \
            --writable build/gameshell-generation

          runuser -u builduser -- \
            env -i \
            HOME=/home/builduser \
            USER=builduser \
            LOGNAME=builduser \
            PATH=/usr/bin:/bin \
            LANG=C.UTF-8 \
            bash -euo pipefail -c '
              test "$(id -u)" -ne 0

              for protected in \
                "$1" "$1/.git" "$1/.github" \
                "$1/arch" "$1/scripts" "$1/source" \
                "$1/source/GameShell" "$1/build" \
                "$1/build/gameshell" "$1/candidate" "$1/evidence"
              do
                test -d "$protected"
                test ! -w "$protected"
              done

              test ! -w "$1/arch/gameshell/PKGBUILD.in"
              test ! -w "$1/scripts/package-pipeline/gameshell_archive_intake.py"

              test -w "$2"
              test -w "$2/GameShell"

              cd "$2/GameShell"
              git checkout --detach "$3"
              test "$(git rev-parse HEAD)" = "$3"
              test -z "$(git status --porcelain)"

              # Preserve normal upstream version calculation.
              test "$(git describe --always --dirty)" = "$4"

              printf "GameShell archive generation UID: %s\n" "$(id -u)"
              ./utils/gameshell_archive.sh -z \
                -N "$2/gameshell"
            ' _ "$GITHUB_WORKSPACE" \
              "$GITHUB_WORKSPACE/build/gameshell-generation" \
              "$SOURCE_SHA" \
              "$(git -C source/GameShell describe --always --dirty)"

          # Intake validates generated files without executing them.
          python3 scripts/package-pipeline/gameshell_archive_intake.py \
            --generated build/gameshell-generation \
            --destination build/gameshell \
            --evidence evidence

          (
            cd evidence
            sha256sum --check --strict game-payload-SHA256SUMS
          )

          archive_sha256="$(
            sha256sum build/gameshell/gameshell.sh | awk '{print $1}'
          )"
          launcher_sha256="$(
            sha256sum build/gameshell/gameshell-launcher | awk '{print $1}'
          )"
          source_sha256="$(
            sha256sum build/gameshell/GameShell-source.tar.gz | awk '{print $1}'
          )"
          license_sha256="$(
            sha256sum build/gameshell/LICENSE | awk '{print $1}'
          )"
          readme_sha256="$(
            sha256sum build/gameshell/README.packaging.md | awk '{print $1}'
          )"

          python3 scripts/package-pipeline/generated_recipe_metadata.py \
            render --package gameshell \
            --value "PKGVER=$PKGVER" \
            --value "SOURCE_SHA=$SOURCE_SHA" \
            --value "ARCHIVE_SHA256=$archive_sha256" \
            --value "LAUNCHER_SHA256=$launcher_sha256" \
            --value "SOURCE_SHA256=$source_sha256" \
            --value "LICENSE_SHA256=$license_sha256" \
            --value "README_SHA256=$readme_sha256" \
            > build/gameshell/PKGBUILD

          chmod 755 \
            build/gameshell/gameshell.sh \
            build/gameshell/gameshell-launcher

          printf '%s  %s\n' \
            "$archive_sha256" gameshell.sh \
            > evidence/game-archive-SHA256SUMS
          printf '%s  %s\n' \
            "$source_sha256" GameShell-source.tar.gz \
            > evidence/source-SHA256SUMS

          (
            cd build/gameshell
            sha256sum --check --strict ../../evidence/game-archive-SHA256SUMS
            sha256sum --check --strict ../../evidence/source-SHA256SUMS
          )

      - name: Build unsigned package
        run: |
          set -euo pipefail
          test "$(id -u builduser)" -ne 0

          # Transfer only the prepared package directory.
          chown -R builduser:builduser build/gameshell

          python3 -I scripts/package-pipeline/build_workspace_boundary.py \
            --user builduser \
            --workspace "$GITHUB_WORKSPACE" \
            --writable build/gameshell-generation \
            --writable build/gameshell

          runuser -u builduser -- \
            env -i \
            HOME=/home/builduser \
            USER=builduser \
            LOGNAME=builduser \
            PATH=/usr/bin:/bin \
            LANG=C.UTF-8 \
            bash -euo pipefail -c '
              test "$(id -u)" -ne 0
              test -w "$1"
              test -w "$1/PKGBUILD"
              test ! -w "$2"
              test ! -w "$2/build"
              test ! -w "$2/evidence"
              test ! -w "$2/candidate"
              cd "$1"
              makepkg --noconfirm --cleanbuild
            ' _ "$GITHUB_WORKSPACE/build/gameshell" \
              "$GITHUB_WORKSPACE"

      - name: Inspect and smoke-test candidate
        env:
          SOURCE_SHA: ${{ needs.detect.outputs.source_sha }}
          EXPECTED_PACKAGE: ${{ needs.detect.outputs.package_file }}
        run: |
          set -euo pipefail

          mkdir -p candidate evidence/package-root
          pkg="build/gameshell/${EXPECTED_PACKAGE}"
          test -f "$pkg"
          cp "$pkg" candidate/

          pacman -Qip "$pkg" | tee evidence/package-info.txt
          bsdtar -tf "$pkg" \
            | sed 's#^\./##' \
            | tee evidence/package-files.txt
          bsdtar -xOf "$pkg" .PKGINFO > evidence/PKGINFO

          required_files=(
            usr/bin/gameshell
            usr/share/gameshell/gameshell.sh
            "usr/share/gameshell/source/GameShell-${SOURCE_SHA}.tar.gz"
            usr/share/licenses/gameshell/LICENSE
            usr/share/doc/gameshell/README.packaging.md
          )
          for required in "${required_files[@]}"; do
            grep -Fxq "$required" evidence/package-files.txt || {
              echo "Required package file missing: $required" >&2
              exit 1
            }
          done

          grep -Fxq 'pkgname = gameshell' evidence/PKGINFO
          grep -Fxq 'arch = any' evidence/PKGINFO
          grep -Fxq 'license = GPL-3.0-only' evidence/PKGINFO

          # Verify packaged source bytes against protected evidence.
          # Read the staged candidate without extracting package files.
          verify_packaged_source() {
            local member="$1"
            local checksum_file="$2"
            local source_name="$3"
            local expected actual
            local -a records matches

            mapfile -t records < "$checksum_file"
            test "${#records[@]}" -eq 1

            expected="${records[0]%% *}"
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
            test "${records[0]}" = "$expected  $source_name"

            mapfile -t matches < <(
              awk -v member="$member" '
                $0 == member || $0 == "./" member { print }
              ' evidence/package-members-raw.txt
            )

            test "${#matches[@]}" -eq 1

            actual="$(
              runuser -u builduser -- \
                env -i \
                HOME=/home/builduser \
                PATH=/usr/bin:/bin \
                LANG=C.UTF-8 \
                bsdtar -xOf "$GITHUB_WORKSPACE/candidate/$EXPECTED_PACKAGE" \
                  -- "${matches[0]}" |
                sha256sum
            )"

            actual="${actual%% *}"
            [[ "$actual" =~ ^[0-9a-f]{64}$ ]]

            if [[ "$actual" != "$expected" ]]; then
              printf 'FAIL: Packaged source checksum mismatch: %s\n' \
                "$member" >&2
              return 1
            fi

            printf '%s  %s\n' "$actual" "$member" \
              >> evidence/packaged-source-SHA256SUMS

            printf 'PASS: Packaged source checksum verified: %s\n' \
              "$member"
          }

          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

          runuser -u builduser -- \
            env -i \
            HOME=/home/builduser \
            PATH=/usr/bin:/bin \
            LANG=C.UTF-8 \
            bsdtar -tf "$GITHUB_WORKSPACE/candidate/$EXPECTED_PACKAGE" \
              > evidence/package-members-raw.txt

          : > evidence/packaged-source-SHA256SUMS

          verify_packaged_source \
            usr/share/gameshell/gameshell.sh \
            evidence/game-archive-SHA256SUMS \
            gameshell.sh

          verify_packaged_source \
            "usr/share/gameshell/source/GameShell-${SOURCE_SHA}.tar.gz" \
            evidence/source-SHA256SUMS \
            GameShell-source.tar.gz

          test "$(wc -l < evidence/packaged-source-SHA256SUMS)" -eq 2

          namcap build/gameshell/PKGBUILD \
            > evidence/namcap-PKGBUILD.txt 2>&1 || true
          namcap "$pkg" \
            > evidence/namcap-package.txt 2>&1 || true
          if grep -Eq ' E: ' \
            evidence/namcap-PKGBUILD.txt \
            evidence/namcap-package.txt
          then
            cat evidence/namcap-PKGBUILD.txt >&2
            cat evidence/namcap-package.txt >&2
            exit 1
          fi

          pacman -U --noconfirm "$pkg"
          install -d -m700 -o builduser -g builduser \
            /home/builduser/.local/share
          su builduser -c '
            set -e
            export HOME=/home/builduser
            export XDG_DATA_HOME=/home/builduser/.local/share
            gameshell -V
            gameshell -h >/dev/null
            test -x "$XDG_DATA_HOME/gameshell/gameshell.sh"
            cmp -s /usr/share/gameshell/gameshell.sh \
              "$XDG_DATA_HOME/gameshell/gameshell.sh"
          '

          package_sha256="$(sha256sum "$pkg" | awk '{print $1}')"
          printf '%s  %s\n' \
            "$package_sha256" "$EXPECTED_PACKAGE" \
            > evidence/package-SHA256SUMS

          {
            echo "PACKAGE_FILE=$EXPECTED_PACKAGE"
            echo "PACKAGE_SHA256=$package_sha256"
          } >> "$GITHUB_ENV"

      - name: Candidate summary
        env:
          SOURCE_REF: ${{ needs.detect.outputs.source_ref }}
          SOURCE_SHA: ${{ needs.detect.outputs.source_sha }}
        run: |
          {
            echo '## GameShell unsigned candidate'
            echo
            echo "- Upstream ref: \`$SOURCE_REF\`"
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo "- Package: \`$PACKAGE_FILE\`"
            echo "- Package SHA-256: \`$PACKAGE_SHA256\`"
            echo '- Signed: **NO**'
            echo '- Published: **NO**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: gameshell-${{ github.run_id }}-${{ github.run_attempt }}-candidate
          path: |
            candidate/
            evidence/
          if-no-files-found: error
          retention-days: 7

  approval-ready:
    name: Notify signing approval ready
    needs:
      - detect
      - validate
    if: >-
      needs.detect.outputs.update == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish == true
    runs-on: ubuntu-latest

    steps:
      - name: Send Pushover approval notification
        env:
          PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PKGVER: ${{ needs.detect.outputs.pkgver }}
          PKGREL: ${{ needs.detect.outputs.pkgrel }}
        run: |
          set -euo pipefail
          test -n "$PUSHOVER_APP_TOKEN"
          test -n "$PUSHOVER_USER_KEY"

          curl \
            --fail --silent --show-error \
            --form-string "token=$PUSHOVER_APP_TOKEN" \
            --form-string "user=$PUSHOVER_USER_KEY" \
            --form-string "title=Package approval required" \
            --form-string \
              "message=gameshell ${PKGVER}-${PKGREL} passed validation and is ready for signing approval." \
            --form-string \
              "url=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --form-string "url_title=Review deployment" \
            https://api.pushover.net/1/messages.json

  publish:
    name: Sign and publish approved candidate
    needs:
      - detect
      - validate
      - approval-ready
    if: >-
      needs.detect.outputs.update == 'true' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish == true
    runs-on: ubuntu-latest

    environment:
      name: arch-repo-publish

    permissions:
      contents: write

    concurrency:
      group: arch-repo-publish
      cancel-in-progress: false
      queue: max

    container:
      image: archlinux:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Install publishing dependencies
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed \
            git github-cli gnupg python libarchive diffutils

      - name: Checkout package infrastructure
        uses: actions/checkout@v6

      - name: Trust checked-out repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download exact validated candidate
        uses: actions/download-artifact@v8
        with:
          name: gameshell-${{ github.run_id }}-${{ github.run_attempt }}-candidate
          path: validated

      - name: Verify validated candidate
        env:
          EXPECTED_PACKAGE: ${{ needs.detect.outputs.package_file }}
        run: |
          set -euo pipefail
          checksum_file=validated/evidence/package-SHA256SUMS
          test -s "$checksum_file"
          read -r expected_sha package_file < "$checksum_file"
          [[ "$package_file" == "$EXPECTED_PACKAGE" ]]

          pkg="validated/candidate/${package_file}"
          test -f "$pkg"
          actual_sha="$(sha256sum "$pkg" | awk '{print $1}')"
          [[ "$actual_sha" == "$expected_sha" ]]

          mkdir -p package-output
          cp "$pkg" package-output/
          {
            echo "PACKAGE_FILE=$package_file"
            echo "PACKAGE_SHA256=$actual_sha"
          } >> "$GITHUB_ENV"

      - name: Import repository signing subkey
        env:
          ARCH_REPO_SIGNING_KEY: ${{ secrets.ARCH_REPO_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$ARCH_REPO_SIGNING_KEY"
          printf '%s\n' "$ARCH_REPO_SIGNING_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$SIGNING_SUBKEY"

      - name: Sign approved package
        env:
          ARCH_REPO_SIGNING_PASSPHRASE: ${{ secrets.ARCH_REPO_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          pkg="package-output/${PACKAGE_FILE}"
          printf '%s' "$ARCH_REPO_SIGNING_PASSPHRASE" \
            | gpg --batch --yes --pinentry-mode loopback \
                --passphrase-fd 0 \
                --local-user "${SIGNING_SUBKEY}!" \
                --output "${pkg}.sig" \
                --detach-sign "$pkg"
          gpg --verify "${pkg}.sig" "$pkg"

      - name: Assemble signed repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARCH_REPO_SIGNING_PASSPHRASE: ${{ secrets.ARCH_REPO_SIGNING_PASSPHRASE }}
        run: bash scripts/package-pipeline/assemble-repository.sh

      - name: Publish rolling Arch repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/package-pipeline/publish-repository.sh

      - name: Publication summary
        env:
          SOURCE_REF: ${{ needs.detect.outputs.source_ref }}
          SOURCE_SHA: ${{ needs.detect.outputs.source_sha }}
        run: |
          {
            echo '## Published GameShell'
            echo
            echo "- Upstream ref: \`$SOURCE_REF\`"
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo "- Package: \`$PACKAGE_FILE\`"
            echo "- Package SHA-256: \`$PACKAGE_SHA256\`"
            echo "- Repository: \`$REPO_NAME\`"
            echo '- Human signing approval: **PASSED**'
          } >> "$GITHUB_STEP_SUMMARY"
