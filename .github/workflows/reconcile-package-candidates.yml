name: Reconcile published package candidates

on:
  workflow_run:
    workflows:
      - Publish gameshell
      - Publish Ghostty
      - Publish KeePassXC
      - Publish Moonlight Qt
      - Publish noctalia-custom
      - Publish noctalia-greeter
      - Publish Syncthing
      - Publish WezTerm
      - Publish Yazi
      - Publish Broot
      - Publish Thunar
    types: [completed]
    branches: [main]
  schedule:
    - cron: '47 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: package-candidate-issue-writes
  cancel-in-progress: false
  queue: max

jobs:
  reconcile:
    name: Verify and close published candidates
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write

    steps:
      - name: Verify reconciliation authorization
        run: |
          set -euo pipefail

          test "$GITHUB_REPOSITORY" = T4T3Z0R/packages
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1

          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              test "$GITHUB_ACTOR" = T4T3Z0R
              test "$GITHUB_TRIGGERING_ACTOR" = T4T3Z0R
              ;;
            schedule)
              ;;
            workflow_run)
              jq -e '
                .workflow_run.conclusion == "success" and
                .workflow_run.status == "completed" and
                .workflow_run.head_branch == "main" and
                .workflow_run.head_repository.full_name
                  == "T4T3Z0R/packages"
              ' "$GITHUB_EVENT_PATH"
              ;;
            *)
              exit 1
              ;;
          esac

      - name: Checkout complete production history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify exact production revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" \
            --jq .commit.sha)" = "$GITHUB_SHA"
          python3 scripts/package-pipeline/validate_manifest.py

      - name: Evaluate publication evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/package-pipeline/reconcile_candidate_publication.py \
            --revision "$GITHUB_SHA" |
            tee reconciliation-plan.json

      - name: Recheck evidence and close completed reviews
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_CLOSURE_ENABLED: "1"
        run: |
          set -euo pipefail
          python3 scripts/package-pipeline/close_published_candidates.py \
            --revision "$GITHUB_SHA" |
            tee reconciliation-result.json

      - name: Upload reconciliation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: candidate-reconciliation-${{ github.run_id }}
          path: |
            reconciliation-plan.json
            reconciliation-result.json
          if-no-files-found: warn
          retention-days: 7
